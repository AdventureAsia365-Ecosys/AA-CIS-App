  a3_landing_belongs: {status: used, classes: [other.c1], note: "A3 landing keyword selector"}
  a3_demand_belongs: {status: used, classes: [other.c1], note: "A3 search-demand selector"}
  a3_atom_in_text: {status: used, class: none, reason: "A3 atomization check (atom present in the source), not writer output"}
