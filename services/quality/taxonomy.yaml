# ------------------------------------------------------------------------------------- code checks
# Detector modules named by module (a Q0 case `detector`). path must be a tracked file.
code_checks:
  repair_contract: {path: services/quality/repair_contract.py, classes: [fact.number, fact.inclusion, struct.truncated, struct.day_structure, scope.framing, other.s7], note: "AA-925 repair invariants: no_new_specifics, no_truncation, days_kept, scope_kept, tags_balanced"}
  degraded: {path: services/quality/degraded.py, classes: [other.degraded_detector]}
  day_oracle: {path: services/quality/day_oracle.py, classes: [struct.day_structure, source.contradiction]}

# ------------------------------------------------------------------------------------------ aliases
# Q0 corpus class ids (tests/unit/quality/cases/*.json, AA-925) → canonical classes. The cases are never
# relabelled for this (a class_id change needs the q0-relabel PR label); the lint requires every Q0 class_id
# and detector to resolve here, so there is one taxonomy. An alias never shadows a class id.
aliases:
  other.banned_pattern: other.v1
  other.brand_forbidden: other.lexicon
  other.brand_name: safety.tenant_isolation
  other.cannibalization: safety.tenant_isolation
  other.cta: other.c5
  other.faq_contract: other.c5
  other.first_line: other.length_shape
  other.forbidden_word: other.lexicon
  other.length: other.length_shape
  other.missing_field: struct.truncated
  source.unsupported_specific: [fact.number, fact.inclusion]
