  t10_same_piece: {status: unused, class: none, reason: "seeded by migration 194, no code reads it"}
  t10_offer_as_certain: {status: unused, class: none, reason: "seeded by migration 194, no code reads it"}
  t10_faq_restates: {status: unused, class: none, reason: "seeded by migration 194, no code reads it"}

# ------------------------------------------------------------------------------------------- chips
chips:
  # acp_shared.content_piece_label.defects keys (admin_content_quality.DEFECT_CLASSES): the set and the
  # order are frozen (stored labels are validated against them).
  defect_classes:
    fact: {label: "Fact", classes: [fact.inclusion, fact.number, fact.misbinding, fact.name, fact.direction, fact.embellish, fact.self_contradiction]}
    voice: {label: "Voice", classes: [other.v1, scope.persona_promise]}
    format: {label: "Format", classes: [struct.truncated, struct.day_structure, other.s3, other.s5, other.s7, other.length_shape]}
    ai_phrasing: {label: "AI phrasing", classes: [other.v1, other.lexicon]}
  # Review Queue held-reason kinds (admin_pipeline._review_block).
  review_block_kinds:
    needs_human: {classes: [fact.inclusion, fact.number, fact.misbinding]}
    hard: {class: none, reason: "aggregate of the surviving A1 hard codes; each code maps itself (a1_codes)"}
    low_quality: {class: none, reason: "score below the pass line, not an error class"}
    other: {class: none, reason: "fallback"}
  # Place-card dedup reasons (Content Quality duplicate view).
  duplicate_reasons:
    same_core_name: {class: none, reason: "place-card dedup, not writer output"}
    name_contains: {class: none, reason: "place-card dedup, not writer output"}
    alias: {class: none, reason: "place-card dedup, not writer output"}

