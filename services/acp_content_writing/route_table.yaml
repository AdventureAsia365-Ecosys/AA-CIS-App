# AA-1049 W3 (root ADR 0020 S5) — the T9 route table's mechanics: how the attempt loop handles each failed T10 gate.
#
# The POLICY half of every row (`repair`: cheap | fix_step | default, and `style_only`) is decided in
# services/quality/writing_policy.yaml route_rows (policy_sha) and never restated here; this file adds the loop
# mechanics the policy does not decide, joined on `gate` by services/acp_content_writing/route_table.py. Kept out of
# the policy file on purpose: the policy_sha is hashed into 16 registered prompt versions, and a change of loop
# mechanics is not a prompt change (no version bump, no migration). The lint tests/unit/quality/
# test_aa1049_route_table.py checks exactly one row per T10 gate id here and in the policy, and that the two agree
# (a cheap row is a sentence repair, a fix_step row a faq / first-line section).
#
#   action  repair_sentence     one sentence repair (sentence_repair.plan); `parse` names the violation format:
#                               quoted "<problem>: '<sentence>'" | f1 (the F1 number quote) | f9 (the judge's claims)
#                               | brand_style (the F9 brand-style phrases);
#           regenerate_section  a deterministic / one-call step owns it (`section`: faq | first_line | seo_fields) and
#                               it never sends the piece to a rewrite; `slug: rewrite` sends a slug violation to the
#                               rewrite (the SEO fit never writes a slug);
#           rewrite             the full rewrite (attempt 2 only; attempt 3 never rewrites, AA-770).
#   cut     truth (an F1 / F9 product-truth item the last attempt may cut in code; merge preference in row order) |
#           cut_finding (cut only when the finding itself says to cut).
# Left after the repair budget, a failed gate is cut (its `cut`) or holds (quality_gates.hold_failure; never a
# style_only row; the F9 classes by writing_policy f9_class_rows).
version: t9-route-table-v1
rows:
  - {gate: F6_cta_present, action: rewrite}
  - {gate: F1_grounding, action: repair_sentence, parse: f1, cut: truth}
  - {gate: F2_lexicon, action: rewrite}
  - {gate: F2_banned_patterns, action: rewrite}
  - {gate: F2_brand_forbidden, action: repair_sentence, parse: quoted}
  - {gate: F2_platform_truth, action: repair_sentence, parse: quoted}
  - {gate: F2_superlatives, action: repair_sentence, parse: quoted}
  - {gate: F2_style_warn, action: rewrite}
  - {gate: F11_brand_name, action: repair_sentence, parse: quoted}
  - {gate: F19_authenticity, action: repair_sentence, parse: quoted}
  - {gate: F10_cannibalization_cross_tenant, action: rewrite}
  - {gate: F4_extreme_length, action: rewrite}
  - {gate: F0_complete, action: rewrite}
  - {gate: F12_scope, action: repair_sentence, parse: quoted}
  - {gate: F13_hygiene, action: repair_sentence, parse: quoted}
  - {gate: F13_leak, action: repair_sentence, parse: quoted}
  - {gate: F13_repeat, action: repair_sentence, parse: quoted}
  - {gate: F17_trip_fact, action: repair_sentence, parse: quoted, cut: cut_finding}
  - {gate: F18_rarity, action: repair_sentence, parse: quoted}
  - {gate: F14_social_shape, action: rewrite}
  - {gate: F14_first_line, action: regenerate_section, section: first_line}
  - {gate: F15_voice, action: repair_sentence, parse: quoted}
  - {gate: F15_voice_warn, action: rewrite}
  - {gate: F4_seo_surface, action: regenerate_section, section: seo_fields, slug: rewrite}
  - {gate: F9_cta_fact, action: repair_sentence, parse: f9, cut: truth}
  - {gate: F9_brand_style, action: repair_sentence, parse: brand_style}
  - {gate: F16_faq, action: regenerate_section, section: faq}
# Channels whose F9 product-truth failure left after the last attempt is cut in code instead of held (AA-786).
# Not the `truth_cut` row of writing_policy.yaml (D6, in policy_sha): this file is in neither policy_sha nor config_fp,
# so a change here (hold vs cut) is versioned by git only, as the Python literal it replaced; the lint pins {linkedin}.
truth_cut:
  cut_not_hold_channels: [linkedin]
# AA-1049 W3 (T2 train) — the T2 linear orchestrator's rows (opt-in T2_ORCHESTRATOR=linear; the default T2 path is the
# LangGraph + T3 loop of main and reads none of this). One row per enforce code the T2 verifier
# (services/content_generation/t2_orchestrator.py verify) can raise: the T3 hard codes (graph._HARD_BLOCK_CODES, as
# T3 filters them), the T3 grounding finding and the Master day-slot check. Same action vocabulary as the T9 rows:
#   repair_sentence     one local sentence repair (tenant_pipeline._t3_sentence_repair + repair_contract);
#   regenerate_section  seo_fields: the meta-only regenerate (tenant_pipeline._t3_meta_regenerate + repair_contract);
#   rewrite             one field-scoped writer call with the deterministic feedback (writer budget);
#   hold                no repair can clear it (an outage): kept for review.
# Mechanics only: the status rule (any enforce finding left = needs_review) does not read this table, so no row can
# make a version pass. A code with no row routes to `default` (fail closed: still an enforce finding).
t2:
  version: t2-route-table-v1
  default: rewrite
  rows:
    - {code: T3_grounding, action: repair_sentence, parse: t3_grounding}
    - {code: SEO_META_TOO_LONG, action: regenerate_section, section: seo_fields}
    - {code: META_TOO_SHORT, action: regenerate_section, section: seo_fields}
    - {code: META_INCOMPLETE_SENTENCE, action: regenerate_section, section: seo_fields}
    - {code: BRAND_SEO_META_VIOLATION, action: regenerate_section, section: seo_fields}
    - {code: SEO_TITLE_TOO_LONG, action: rewrite}
    - {code: FORBIDDEN_WORD, action: rewrite}
    - {code: MISSING_FIELD, action: rewrite}
    - {code: T2_DAY_COUNT_VS_MASTER, action: rewrite}
    - {code: DEGRADED_DETECTOR, action: hold}
# AA-1049 W3 (S1 train) — the S1 rows (opt-in S1_CONTROL=contract; the default A1 path of main reads none of this). One
# row per S1 code of the taxonomy (services/quality/taxonomy.yaml a1_codes: every code A1 validate, the brand
# pre-audit, grounding, the day oracle and the degraded marker can emit); the lint (route_table.s1_coverage_errors,
# tests/unit/quality/test_aa1049_route_table.py) requires exactly that set. Actions, as the S1 path runs them
# (services/content_generation/s1_train.py):
#   cut                 a code delete of the offending sentence / item when its field keeps the rest (local_fix; for the
#                       grounding codes, grounding.cut_and_recheck in the grounding node, then a re-check). S277: no
#                       S1 action makes a model call (no repair_sentence: the path makes no s1_flag_fix call);
#   regenerate_section  a deterministic section step: forbidden strip, SEO title fit, meta fit then the code meta
#                       template (local_fix), the name normaliser (final_contract_node);
#   rewrite             one redraft by the writer while drafts remain (route_after_judge, 2 drafts in total);
#   hold                no step on this path clears it: left for the reviewer (when it blocks) or reported.
# Mechanics only: the publish gate (admin_pipeline._is_publishable, hard_block_codes) does not read this table, so no
# row can publish a tour. A code with no row routes to `default` (fail closed: hold).
s1:
  version: s1-route-table-v1
  default: hold
  rows:
    # fact fidelity
    - {code: UNSUPPORTED_NUMBER, action: cut}
    - {code: UNSUPPORTED_CLAIM, action: cut}
    - {code: ITINERARY_MEAL_TIME_INVENTED, action: cut}
    - {code: HIGHLIGHTS_OPTIONAL_LANGUAGE, action: cut}
    - {code: NUMBER_NOT_IN_SOURCE, action: hold}
    - {code: NUMBER_NOUN_MISMATCH, action: hold}
    - {code: NAME_NOT_IN_SOURCE, action: hold}
    - {code: INCLUSION_CONTRADICTED, action: hold}
    - {code: PRODUCT_TRUTH_RISK, action: hold}
    - {code: FACT_CHECK_MANUAL_CHECK, action: hold}
    # day structure (the writer redrafts; the code-composed headings never add or drop a day)
    - {code: ITINERARY_DAY_COUNT_MISMATCH, action: rewrite}
    - {code: ITINERARY_STILL_COMPRESSED, action: rewrite}
    - {code: ITINERARY_STRUCTURE_WEAK, action: rewrite}
    - {code: DAY_OUTPUT_GAP, action: rewrite}
    - {code: DAY_OUTPUT_DUPLICATE, action: rewrite}
    - {code: DAY_OUTPUT_EXTRA, action: rewrite}
    - {code: DAY_OUTPUT_ORDER, action: rewrite}
    - {code: DAY_SUBDAY_SPLIT, action: rewrite}
    - {code: DAY_DEPARTURE_MIDTRIP, action: hold}
    - {code: DAY_PLACE_MISMATCH, action: hold}
    - {code: DAY_COUNT_VS_DURATION, action: hold}
    - {code: SOURCE_DAY_CONTRADICTION, action: hold}
    # truncation / missing output
    - {code: MISSING_FIELD, action: rewrite}
    - {code: TEXT_TRUNCATED, action: rewrite}
    # SEO title and meta (code fit, then the code template)
    - {code: SEO_META_TOO_LONG, action: regenerate_section}
    - {code: META_TOO_SHORT, action: regenerate_section}
    - {code: META_INCOMPLETE_SENTENCE, action: regenerate_section}
    - {code: META_CUT, action: regenerate_section}
    - {code: META_CUT_SIGNATURE, action: regenerate_section}
    - {code: META_LENGTH, action: regenerate_section}
    - {code: META_OPENER_ROBOTIC, action: regenerate_section}
    - {code: META_PACKAGE_WORD, action: regenerate_section}
    - {code: BRAND_SEO_META_VIOLATION, action: regenerate_section}
    - {code: META_DFS_VERBATIM, action: regenerate_section}
    - {code: SEO_TITLE_TOO_LONG, action: regenerate_section}
    - {code: FORBIDDEN_WORD, action: regenerate_section}
    - {code: NAME_ALL_CAPS, action: regenerate_section}
    # voice and format (report on a v2 draft, or held for the reviewer: no whole-field model rewrite on this path)
    - {code: GENERIC_AI_WORDING, action: hold}
    - {code: STOCK_SUPERLATIVE, action: hold}
    - {code: NAME_SUPERLATIVE, action: hold}
    - {code: HIGHLIGHTS_NOT_LIST, action: hold}
    - {code: HIGHLIGHTS_ORDERING_WRONG, action: hold}
    - {code: HIGHLIGHTS_TOO_FEW, action: hold}
    - {code: HIGHLIGHTS_TOO_GENERIC, action: hold}
    - {code: ITINERARY_DAY_TITLE_GENERIC, action: hold}
    - {code: SUBTITLE_CITY_LIST, action: hold}
    - {code: SUBTITLE_GENERIC, action: hold}
    - {code: SUBTITLE_TRIP_TYPE_MISMATCH, action: hold}
    - {code: SUBTITLE_WAYPOINT_FORMAT, action: hold}
    - {code: SUMMARY_HONEYMOON_LANGUAGE, action: hold}
    - {code: SUMMARY_OFF_BRAND, action: hold}
    - {code: SUMMARY_SELF_REFERENTIAL, action: hold}
    - {code: SEO_TITLE_WEAK, action: hold}
    - {code: SEO_TITLE_WRONG_ACTIVITY, action: hold}
    - {code: DFS_INTENT_UNDERUSED, action: hold}
    - {code: BRAND_AUDIT_FLAGGED, action: hold}
    # detectors that did not run (an outage: no step can clear it)
    - {code: DEGRADED_DETECTOR, action: hold}
    - {code: DAY_CHECK_SKIPPED, action: hold}
    - {code: BRAND_AUDIT_UNAVAILABLE, action: hold}
    - {code: BRAND_AUDIT_UNCALIBRATED_JUDGE, action: hold}
