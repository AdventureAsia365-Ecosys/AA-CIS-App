# AA-1047 (S272) — the W2 intent of the writing policy's claim examples. KEPT, NOT ASSERTED.
#
# S272 decision: three adversarial review rounds of AA-1047 did not converge. Every hand-written rule that turned a
# block into a warn (a background number per D1 / F6, a place rarity per D13, the T9 short-meta country tail) kept
# failing open on new inputs. The gates stay fail-closed as on main until the W2 claim instrument (D7, D10) is
# measured; services/quality/writing_policy.yaml marks the D1 / D13 / numbers topics
# `enforcement: block_until_w2_instrument` and asserts main's verdicts in its `examples`.
#
# Two lists, in the policy's example format (same ids, same `example_seeds` of writing_policy.yaml):
#
# - `w2_intent`: examples the policy still asserts, at main's verdict (`main:`); `expect` / `all` here are the decided
#   intent (D1: a background number or year warns; D13: a place rarity warns; D3/D1: an uncited background about a
#   named place passes). W2 turns these on once its instrument holds them with a measurement record.
# - `main_gaps`: examples main decides MORE leniently than even the fail-closed policy (`main:` below the intended
#   block), or where a fixer leaves text its own check fails (`main_fixed`). They are not in the asserted suite (it
#   would fail, or enshrine the gap): access rarity ('a rare chance', 'few groups'), a number only another trip's line
#   or the AUDIENCE line gives, a place outside the source in uncited background, and a CTA-close case ensure_cta
#   leaves for check_cta to fail. The branch's stricter fixes for them were withdrawn with the warn rules (they rode
#   on the same trip-frame code); W2 owns them.
#
# Nothing reads this file at run time; tests/unit/quality/test_aa1047_contradictions.py only checks it parses, its
# ids are not asserted policy examples, and its seeds exist.

