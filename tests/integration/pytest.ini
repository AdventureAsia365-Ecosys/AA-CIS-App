[pytest]
testpaths = tests/integration
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    requires_aws: marks tests that need real AWS credentials
    real_provider_circuit: run with the AA-1025 B3 provider circuit on (the test points its DB runner at this DB)
