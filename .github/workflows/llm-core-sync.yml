name: Llm Core Sync
# AA-642 S8 (root ADR 0009 decision 13): after a CIS merge that touches the shared AI gateway core (shared/aa_llm/),
# open or update one PR per consumer repo that copies it, byte for byte, with its aa_llm.lock.json. The copy is
# .github/scripts/llm-core-sync.sh (the same code agents run by hand); the git/PR steps are
# .github/scripts/llm_core_sync_bot.py. Modelled on kit-sync.yml.
#
#   AA-TripPlanner-Web  backend/aa_llm   (reads the CIS contract views, writes the shared ledger)
#   AA-Partner          api/app/aa_llm   (code only: the CRM keeps its own config and ledger, root ADR 0008a)
#
# The PR (branch bot/llm-core-sync, regenerated from the consumer's main every run) is opened with an aa-ecosys-ci-bot
# installation token minted per matrix leg and narrowed to that one consumer repo, Contents + Pull requests write only
# (no Workflows, Actions or Secrets), so the consumer's CI runs on it. The bot never merges: the orchestrating agent
# merges after the consumer's CI is green.
#
# Manual run: Actions -> Llm Core Sync -> Run workflow on main; dry_run (default true) copies and commits in the
# runner, prints the PR it would open, and never pushes or calls the PR API.
on:
  push:
    branches: [main]
    paths:
      - "shared/aa_llm/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Copy and commit in the runner only: no push, no PR"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: llm-core-sync-${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && 'push' || 'dry' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.plan.outputs.changed }}
      repos: ${{ steps.plan.outputs.repos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Did the core change?
        id: plan
        env:
          BASE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/llm_core_sync_bot.py plan --base "$BASE_SHA" --head "$GITHUB_SHA"

  sync:
    name: Sync ${{ matrix.repo }}
    needs: plan
    if: needs.plan.outputs.changed == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Environment "release": deployment branch policy main only, holds AA_CI_BOT_PRIVATE_KEY (as kit-sync.yml).
    environment: release
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.repos) }}
    steps:
      - name: Check out AA-CIS-App (the core at this commit, history for the core log)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: cis
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Mint the CI bot App token (this consumer repo only)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.AA_CI_BOT_PRIVATE_KEY }}
          owner: AdventureAsia365-Ecosys
          repositories: ${{ matrix.repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Check out ${{ matrix.repo }} main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: AdventureAsia365-Ecosys/${{ matrix.repo }}
          ref: main
          path: consumer
          fetch-depth: 1
          token: ${{ steps.app-token.outputs.token }}

      - name: Bot commit identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          id=$(gh api "/users/${SLUG}%5Bbot%5D" --jq .id)
          echo "name=${SLUG}[bot]" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${SLUG}[bot]@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Sync the core and open or update the PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ matrix.repo }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_NAME: ${{ steps.bot.outputs.name }}
          BOT_EMAIL: ${{ steps.bot.outputs.email }}
        run: |
          set -euo pipefail
          dry=()
          if [ "$DRY_RUN" = "true" ]; then dry=(--dry-run); fi
          python3 cis/.github/scripts/llm_core_sync_bot.py --cis cis sync --repo "$REPO" --dest consumer \
            --ref "$GITHUB_SHA" --run-url "$RUN_URL" --author-name "$BOT_NAME" --author-email "$BOT_EMAIL" "${dry[@]}"
