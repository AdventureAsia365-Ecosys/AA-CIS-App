name: Cache warm

# S273 (AA-1024): caches are saved only on the default branch (workflow_lint WL4): a copy saved on a pull request or
# merge-queue ref is readable only by that ref, and those copies filled the 10 GB per-repo cap (LRU eviction then hit
# main's entries). CI here runs on pull_request / merge_group only (S271: no push run on main), so nothing in CI saves on
# main any more; this workflow does, with the SAME keys and paths as CI restores (a key change in ci.yml must change
# here too: .github/scripts/test_cache_warm.py compares them). Pull request and merge-queue runs restore these entries.
#   push to main (a lock file, the release pins or this file changed) and workflow_dispatch: every job.
#   schedule (daily): the trivy DB for the day; the other jobs only look the key up and stop on a hit.
# The uv cache is saved by the nightly integration run (schedule = main, setup-uv save-cache); the URL-pinned wheels by
# their own action on main (Deploy Dev, nightly).
# Each job looks its key up first (lookup-only) and installs + saves only on a miss. No secret, no AWS.
on:
  push:
    branches: [main]
    paths:
      - "frontend/package-lock.json"
      - ".github/actions/release-bin/pins.txt"
      - ".github/workflows/cache-warm.yml"
  schedule:
    - cron: "23 0 * * *"
  workflow_dispatch:

permissions:
  contents: read   # checkout; release-bin's authenticated `gh release download` of public release assets

concurrency:
  group: cache-warm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm cache (frontend/package-lock.json)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Look the key up
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/package-lock.json') }}
          lookup-only: true

      # --ignore-scripts: only the package tarballs are wanted (~/.npm); no install script of a dependency runs here.
      - name: npm ci (fills the npm cache)
        if: steps.npm-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Save npm cache
        if: github.ref == 'refs/heads/main' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

  release-bins:
    name: Release binaries (${{ matrix.runner }})
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            tools: "trivy syft oasdiff"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: trivy (release-bin, saves on a miss)
        if: contains(matrix.tools, 'trivy')
        uses: ./.github/actions/release-bin
        with:
          tool: trivy

      - name: syft (release-bin, saves on a miss)
        if: contains(matrix.tools, 'syft')
        uses: ./.github/actions/release-bin
        with:
          tool: syft

      - name: oasdiff (release-bin, saves on a miss)
        if: contains(matrix.tools, 'oasdiff')
        uses: ./.github/actions/release-bin
        with:
          tool: oasdiff

  trivy-db:
    name: Trivy DB (daily)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same key and path as the Docker Build Check's "Restore trivy DB" step (ci.yml).
      - name: Trivy DB cache key (UTC day)
        id: trivy-day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Look the key up
        id: trivy-db
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: trivy-db-${{ steps.trivy-day.outputs.day }}
          lookup-only: true

      - name: Install trivy (pinned, cached)
        if: steps.trivy-db.outputs.cache-hit != 'true'
        uses: ./.github/actions/release-bin
        with:
          tool: trivy

      - name: Download the vulnerability DB
        if: steps.trivy-db.outputs.cache-hit != 'true'
        run: trivy image --download-db-only --cache-dir "$GITHUB_WORKSPACE/.cache/trivy" --no-progress

      - name: Save trivy DB
        if: github.ref == 'refs/heads/main' && steps.trivy-db.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: ${{ steps.trivy-db.outputs.cache-primary-key }}
