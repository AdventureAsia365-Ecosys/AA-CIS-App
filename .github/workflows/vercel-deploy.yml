name: Vercel Deploy

# S241 — the frontend's Vercel deployments are created HERE, not by the Vercel Git integration.
# `frontend/vercel.json` sets `git.deploymentEnabled: false`, so a push to any branch no longer makes
# a deployment by itself. Why: the Hobby team cap is ~100 deployments / 24 h for the whole team (all
# 3 projects), and deployments CANCELED by the Ignored Build Step still count. Vercel's "skip
# unaffected projects" needs npm workspaces, so it cannot help here.
#
# Only PRs / pushes to main that touch `frontend/**` (or this file) deploy:
#   pull_request            → preview of the PR head commit (+ one PR comment, + UI smoke on it)
#   push to main            → production
#   workflow_dispatch       → preview or production (production only from main)
#
# The deploy runs from the REPO ROOT: the project's Root Directory setting is `frontend`, so Vercel
# builds `frontend/` remotely with the project's own env vars (no `vercel pull` / prebuilt here).
#
# Needs the repo secret VERCEL_TOKEN (a Vercel token scoped to the team). While it is empty the job
# FAILS (red) on every target — nothing else deploys the frontend, so a silent green skip would hide a
# production that stopped updating. Fork PRs get no secrets and are skipped by the job `if:` instead.
# The org / project ids are not secrets.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "frontend/**"
      - ".github/workflows/vercel-deploy.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/vercel-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: "preview, or production (production only from main)"
        required: true
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

concurrency:
  # One group per ref AND target, so a manual preview on main can never cancel a production deploy.
  group: vercel-deploy-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'preview' || (github.event_name == 'push' && 'production' || inputs.target) }}
  # A newer push cancels an in-flight PREVIEW only; a production deploy is never cancelled mid-way
  # (a newer main push waits for it instead).
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.target == 'preview') }}

env:
  VERCEL_ORG_ID: team_zHOmLxnHRN3EC6hXHbXgTG81
  VERCEL_PROJECT_ID: prj_glZmOvskbPdMg20mbI9ywEI9S5tr # aa-cis-frontend
  VERCEL_CLI: vercel@60.0.1
  VERCEL_TELEMETRY_DISABLED: "1"

jobs:
  deploy:
    name: Vercel deploy
    runs-on: ubuntu-latest
    # PRs from forks get no secrets — never try to deploy them.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      target: ${{ steps.plan.outputs.target }}
      sha: ${{ steps.plan.outputs.sha }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      # All values reach `run:` through env (never `${{ }}` interpolation inside the script).
      - name: Plan (target, commit, token present?)
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          REF: ${{ github.ref }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          HAS_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          case "$EVENT" in
            pull_request) TARGET=preview ;;
            push) TARGET=production ;;
            *) TARGET="${INPUT_TARGET:-preview}" ;;
          esac
          if [ "$TARGET" = "production" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys only from main (this run is on $REF)."
            exit 1
          fi
          # No token = no deployment at all (the Git integration is off), so fail RED on every target:
          # a green run with nothing deployed would pass a "CI green" check while production stays old.
          if [ "$HAS_TOKEN" != "true" ]; then
            if [ "$TARGET" = "production" ]; then
              echo "::error::VERCEL_TOKEN is not set — this commit was NOT deployed to Vercel production (the Git integration is off). Set the secret, then re-run this workflow or dispatch it with target=production."
            else
              echo "::error::VERCEL_TOKEN is not set — no preview was deployed (the Git integration is off). Set the secret, then re-run this workflow."
            fi
            exit 1
          fi
          ENABLED=true
          {
            echo "target=$TARGET"
            echo "sha=$SHA"
            echo "enabled=$ENABLED"
          } >> "$GITHUB_OUTPUT"
          echo "Target: $TARGET | commit: $SHA | deploy enabled: $ENABLED"

      - name: Checkout the commit to deploy
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/checkout@v5
        with:
          # The PR HEAD commit (not the synthetic merge commit), like the Git integration deployed.
          ref: ${{ steps.plan.outputs.sha }}
          persist-credentials: false

      - name: Set up Node 22
        if: steps.plan.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # stdout of `vercel deploy` is the deployment URL; progress / build logs go to stderr.
      # The CLI waits for the remote build and exits non-zero when it fails.
      - name: Deploy (remote build of frontend/ via the project's Root Directory)
        if: steps.plan.outputs.enabled == 'true'
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TARGET: ${{ steps.plan.outputs.target }}
        run: |
          set -euo pipefail
          ARGS=(deploy --yes --token "$VERCEL_TOKEN" --scope "$VERCEL_ORG_ID")
          if [ "$TARGET" = "production" ]; then ARGS+=(--prod); fi
          npx --yes "$VERCEL_CLI" "${ARGS[@]}" > "$RUNNER_TEMP/vercel-deploy.out"
          URL=$(grep -Eo 'https://[^[:space:]]+' "$RUNNER_TEMP/vercel-deploy.out" | tail -n1 || true)
          if [ -z "$URL" ]; then
            echo "::error::vercel deploy printed no deployment URL."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed ($TARGET): $URL"

      # Production protection keeps the deployment URL behind Vercel auth (custom domains are public),
      # so the URL is checked with the automation-bypass header when that secret exists; otherwise
      # the status is only logged.
      - name: Check the production deployment answers
        if: steps.plan.outputs.target == 'production' && steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          CODE=000
          for _ in 1 2 3; do
            if [ -n "$BYPASS" ]; then
              CODE=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 \
                       -H "x-vercel-protection-bypass: $BYPASS" "$URL/" || echo 000)
            else
              CODE=$(curl -sS -L -o /dev/null -w '%{http_code}' --max-time 30 "$URL/" || echo 000)
            fi
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          echo "GET $URL/ -> HTTP $CODE"
          if [ "$CODE" != "200" ]; then
            if [ -n "$BYPASS" ]; then
              echo "::error::Production deployment answered HTTP $CODE (expected 200)."
              exit 1
            fi
            echo "::notice::No VERCEL_AUTOMATION_BYPASS_SECRET — status only logged (401/403 = deployment protection)."
          fi

      - name: Job summary
        if: always() && steps.plan.outputs.enabled == 'true'
        env:
          TARGET: ${{ steps.plan.outputs.target }}
          SHA: ${{ steps.plan.outputs.sha }}
          URL: ${{ steps.deploy.outputs.url }}
          OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          {
            echo "### Vercel deploy — $TARGET"
            echo ""
            echo "- Commit: \`$SHA\`"
            echo "- Result: $OUTCOME"
            echo "- URL: ${URL:-n/a}"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Post/update ONE comment on the PR (same pattern as ui-smoke.yml) ──
      - name: Comment the preview URL on the PR
        if: always() && github.event_name == 'pull_request' && steps.plan.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ steps.plan.outputs.sha }}
          URL: ${{ steps.deploy.outputs.url }}
          OUTCOME: ${{ steps.deploy.outcome }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
        run: |
          MARKER="<!-- vercel-preview-deploy -->"
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          if [ "$OUTCOME" = "success" ] && [ -n "$URL" ]; then STATUS="✅ ready"; else STATUS="❌ failed"; fi
          # shellcheck disable=SC2016  # the backticks are literal Markdown
          BODY=$(printf '%s\n### Vercel preview — %s\n\nCommit: `%s`\n\nPreview: %s\n\n[Deploy run](%s)\n' \
                   "$MARKER" "$STATUS" "$SHA" "${URL:-n/a}" "$RUN_URL")
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                       --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" 2>/dev/null | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
            echo "Updated comment $EXISTING"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "Created a new comment"
          fi

  # AA-732 UI smoke on the fresh PREVIEW. It used to run on Vercel's `deployment_status` event, which
  # only the Git integration sends — so it is now called from here.
  smoke:
    name: UI smoke
    needs: deploy
    if: needs.deploy.outputs.target == 'preview' && needs.deploy.outputs.url != ''
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/ui-smoke.yml
    with:
      base_url: ${{ needs.deploy.outputs.url }}
      sha: ${{ needs.deploy.outputs.sha }}
    secrets: inherit
