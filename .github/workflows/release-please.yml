name: Release Please
# AA-891 — keeps one release PR open on main (version bump + CHANGELOG.md). Merging it tags vX.Y.Z and makes the
# GitHub release. Config: release-please-config.json (manifest mode); current version: .release-please-manifest.json;
# the version in code: api/version.py (extra-files). Merging a release PR does not redeploy: deploy-dev.yml has
# no path for CHANGELOG.md or the manifest and ignores api/version.py; vercel-deploy.yml only watches frontend/.
#
# The release PR is opened with the aa-ecosys-ci-bot GitHub App token, not GITHUB_TOKEN: a PR opened by
# GITHUB_TOKEN does not trigger workflows, so the required checks would never run on it. GITHUB_TOKEN gets
# contents: read only; every write (branch, PR, label, tag, release) is done by the App token.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    # Environment "release": deployment branch policy main only, holds AA_CI_BOT_PRIVATE_KEY.
    environment: release
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Mint the CI bot App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.AA_CI_BOT_PRIVATE_KEY }}
          # Only what release-please writes: branch/tag/release (contents), the PR, its labels (issues).
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # AA-899: the release carries the API reference of its commit. docs/api/openapi.json is current on every main
      # commit (Unit Tests fails a stale one), so only the version is stamped in. No Python, no install.
      - name: Check out the released commit
        if: steps.release.outputs.release_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false
      - name: Attach the OpenAPI document to the release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/aa-cis-openapi-${TAG}.json"
          jq --arg v "${TAG#v}" '.info.version = $v' docs/api/openapi.json > "$out"
          gh release upload "$TAG" "$out" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Attached $(basename "$out") to ${TAG}" >> "$GITHUB_STEP_SUMMARY"
      - name: Summary
        if: always()
        env:
          RELEASED: ${{ steps.release.outputs.release_created }}
          TAG: ${{ steps.release.outputs.tag_name }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          if [ "$RELEASED" = "true" ]; then
            echo "Released $TAG" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$PR" ]; then
            echo "Release PR open or updated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Nothing to release" >> "$GITHUB_STEP_SUMMARY"
          fi
