name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint deps
        run: pip install flake8 flake8-bugbear

      - name: Run flake8
        run: |
          flake8 api/ services/ shared/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E302,E303,E305,E221,F401,E128,E124,E401,E127,E126,B008,E701,F821,F841,W291,E272,W293,E231 \
            --exclude=__pycache__,.venv,migrations

      # AA-902: this repo is public — no AWS account ID, ARN with an account, VPC resource ID or API
      # Gateway host in any tracked file. Blocking; exceptions only in .github/resource-id-allowlist.txt
      # with an expiry date. Standard library only.
      - name: Resource-ID check (public repo)
        run: python3 .github/scripts/check_resource_ids.py

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1 --quiet

      # AA-868: failing. Accepted findings live in .github/pip-audit-ignore.txt with an expiry date;
      # an expired entry or any finding not on the list turns this check red.
      - name: Audit main requirements (failing)
        run: bash .github/scripts/pip_audit_gate.sh requirements.txt


  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # AA-925: the Q0 red-on-base step needs the PR merge commit's first parent (the base tip).
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          ENVIRONMENT: test
          AWS_REGION: us-west-1
          AWS_DEFAULT_REGION: us-west-1
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          OPENAI_API_KEY: sk-test-dummy
          JWT_SECRET: test-jwt-secret-ci-only-not-real
          DATAFORSEO_LOGIN: test
          DATAFORSEO_PASSWORD: test
          LANGFUSE_SECRET_KEY: test
          LANGFUSE_PUBLIC_KEY: test
          LANGFUSE_HOST: http://localhost:3000
        run: |
          pytest tests/unit/ -v \
            --tb=short \
            --cov=services \
            --cov=shared \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
          pytest tests/acp/ -v \
            --tb=short

      # AA-879: coverage ratchet (replaces --cov-fail-under=30; the real total was ~86%). Fails below the
      # floor in .github/coverage-ratchet.json, or when a PR lowers that floor against the base tip (HEAD^1
      # of the pull_request merge ref; on a push the base is the previous commit). Below the monthly goal
      # only warns.
      - name: Coverage ratchet
        run: |
          BASE_ARGS=()
          if git rev-parse -q --verify HEAD^1 >/dev/null; then BASE_ARGS=(--base HEAD^1); fi
          python3 .github/scripts/coverage_ratchet.py coverage.xml "${BASE_ARGS[@]}"

      # AA-925 (Q-2): every NEW Q0 case (tests/unit/quality/cases) must FAIL on the base-branch tip, and an
      # existing truth label may change only with the `q0-relabel` PR label (labels are read from the event:
      # after adding the label, push a commit so the run sees it). HEAD^1 of the pull_request merge ref is
      # the base tip. See .github/scripts/q0_red_on_base.py.
      - name: Q0 red on base
        if: github.event_name == 'pull_request'
        env:
          ENVIRONMENT: test
          AWS_REGION: us-west-1
          AWS_DEFAULT_REGION: us-west-1
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          OPENAI_API_KEY: sk-test-dummy
          JWT_SECRET: test-jwt-secret-ci-only-not-real
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python .github/scripts/q0_red_on_base.py --base "$(git rev-parse HEAD^1)"

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cistest
          POSTGRES_PASSWORD: cistest
          POSTGRES_DB: cis_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r tests/integration/requirements-integration.txt

      - name: Setup test DB user
        run: |
          PGPASSWORD=cistest psql -h localhost -U cistest \
            -d cis_integration_test \
            -c "SELECT 1" 2>/dev/null || \
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -c "CREATE USER cistest WITH PASSWORD 'cistest' SUPERUSER;" \
            -c "CREATE DATABASE cis_integration_test OWNER cistest;" 2>/dev/null || true
          PGPASSWORD=cistest psql -h localhost -U cistest -d cis_integration_test \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user LOGIN PASSWORD 'appuser123'; END IF; END \$\$;" || true

      - name: Run integration tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://cistest:cistest@localhost:5432/cis_integration_test
          REDIS_URL: redis://localhost:6379
          AWS_REGION: us-west-1
          AWS_DEFAULT_REGION: us-west-1
          OPENAI_API_KEY: sk-test-dummy
          JWT_SECRET: test-jwt-secret-ci-only-not-real
          DATAFORSEO_LOGIN: test
          DATAFORSEO_PASSWORD: test
          LANGFUSE_SECRET_KEY: test
          LANGFUSE_PUBLIC_KEY: test
          LANGFUSE_HOST: http://localhost:3000
        run: |
          pytest tests/integration/ \
            --ignore=tests/integration/test_007_rls_isolation.py \
            -v --tb=short -p no:cacheprovider

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build \
            --tag aa-cis-api:ci-${{ github.sha }} \
            --file Dockerfile \
            .

      - name: Verify image exists
        run: |
          docker image inspect aa-cis-api:ci-${{ github.sha }}
          echo "Image built successfully ✅"

      # AA-879: the image scan is blocking (it was report-only since AA-177). It fails on any CRITICAL/HIGH
      # finding that HAS a fix (`ignore-unfixed`): the fix is a dependency bump or a rebuilt base image.
      # Reviewed report before the flip (main run 39633516311, 21/10/2026): 145 OS findings (debian 13),
      # none with a fixed version; Python packages clean. An accepted fixable finding goes into .trivyignore
      # with a reason and an `exp:` date (checked by the step below; at most 90 days ahead).
      - name: Trivy ignore entries carry a reason and an expiry
        run: python3 .github/scripts/check_trivyignore.py .trivyignore

      - name: Scan image for vulnerabilities (Trivy, failing on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "aa-cis-api:ci-${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"

      # sbom-action auto-uploads its own GitHub Actions artifact when it detects it's running
      # in a GHA workflow (its documented default behavior) -- artifact-name below controls
      # that upload's name directly, no separate actions/upload-artifact step needed.
      - name: Generate SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@v0.24.2
        with:
          image: "aa-cis-api:ci-${{ github.sha }}"
          format: cyclonedx-json
          output-file: sbom-${{ github.sha }}.cdx.json
          artifact-name: sbom-${{ github.sha }}.cdx.json

  # AA-732 — frontend ESLint (UI-kit conventions). New, NON-required job: it is not one of the 5
  # existing required checks and does not rename them.
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 74 pre-existing errors in legacy pages; fixed under AA-601, then remove continue-on-error.
      # Step-level (not job-level): a job-level continue-on-error still shows a red check on every PR.
      - name: Run ESLint (write summary to the job summary)
        working-directory: frontend
        continue-on-error: true
        run: |
          set +e
          npm run lint 2>&1 | tee lint-output.txt
          STATUS=${PIPESTATUS[0]}
          SUMMARY_LINE=$(grep -E "problems \(" lint-output.txt | tail -n1)
          {
            echo "### Frontend ESLint"
            echo ""
            echo "${SUMMARY_LINE:-No summary line (lint produced no problems)}"
            echo ""
            echo "_Non-required job; 74 pre-existing legacy errors tracked under AA-601._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS 

  # AA-885 — ESLint for the tenant portal app (portal/, same UI-kit rules as the admin). NON-required,
  # same shape as frontend-lint. The 9 errors it starts with came over with the moved portal files
  # (set-state-in-effect, no-explicit-any, one unescaped quote) — not new code.
  portal-lint:
    name: Portal Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install portal dependencies
        working-directory: portal
        run: npm ci

      - name: Run ESLint (write summary to the job summary)
        working-directory: portal
        continue-on-error: true
        run: |
          set +e
          npm run lint 2>&1 | tee lint-output.txt
          STATUS=${PIPESTATUS[0]}
          SUMMARY_LINE=$(grep -E "problems \(" lint-output.txt | tail -n1)
          {
            echo "### Portal ESLint"
            echo ""
            echo "${SUMMARY_LINE:-No summary line (lint produced no problems)}"
            echo ""
            echo "_Non-required job; the pre-existing errors moved here from the admin app with the portal files (AA-885)._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

  # AA-879 — type-check and production build of the admin app (frontend/). NEW job, meant to become a
  # required check: tsc catches prop/type errors ESLint misses, and `next build` catches what only a build
  # sees (server/client boundaries, route config, Turbopack). Builds without any secret or env var (the
  # app reads its API URL and Cognito settings at runtime); Sentry source-map upload is skipped without
  # SENTRY_AUTH_TOKEN. ESLint stays in the non-required "Frontend Lint" job (AA-601 legacy errors).
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit -p .

      - name: Build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # AA-879 — the same for the tenant portal (portal/, AA-885). Its tsc step moved here from "Portal Lint".
  portal-build:
    name: Portal Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit -p .

      - name: Build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
