name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**"]
  # AA-889 (merge queue): the queue tests each group on a temporary gh-readonly-queue/main/* commit and waits for
  # every required check there. All jobs run on it, with no path filter, so no required check is left unreported.
  merge_group:
    types: [checks_requested]

# AA-993 (CIS-4): a new push to a PR cancels that PR's older run. Every other event (push, merge_group) gets its own
# group keyed on run_id, so main pushes are never serialised or cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install lint deps
        # AA-926: PyYAML for the quality registry lint, pinned to the requirements.txt version.
        run: pip install flake8 flake8-bugbear pyyaml==6.0.3

      - name: Run flake8
        run: |
          flake8 api/ services/ shared/ \
            --max-line-length=120 \
            --extend-ignore=E203,W503,E302,E303,E305,E221,F401,E128,E124,E401,E127,E126,B008,E701,F821,F841,W291,E272,W293,E231 \
            --exclude=__pycache__,.venv,migrations

      # AA-902: this repo is public — no AWS account ID, ARN with an account, VPC resource ID or API
      # Gateway host in any tracked file. Blocking; exceptions only in .github/resource-id-allowlist.txt
      # with an expiry date. Standard library only.
      - name: Resource-ID check (public repo)
        run: python3 .github/scripts/check_resource_ids.py

      # AA-919 (WM-17): no real golden-set / tenant text in this public repo. Fixture markers always; keyed
      # fingerprints (.github/golden_text_fingerprints.txt, key = secret GOLDEN_GUARD_KEY) on this repo's own pushes
      # and PRs, where a missing key fails the step. A fork or Dependabot run (no secret) checks the markers only.
      # Prints paths and counts, never the matched text. Standard library only (services/golden_set/text_guard.py).
      - name: Golden-set text guard (public repo)
        env:
          GOLDEN_GUARD_KEY: ${{ secrets.GOLDEN_GUARD_KEY }}
          GOLDEN_GUARD_REQUIRE_KEY: >-
            ${{ github.actor != 'dependabot[bot]' && (github.event_name == 'push'
            || github.event_name == 'merge_group'
            || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: python3 -m services.golden_set.text_guard scan

      # AA-926 (Quality System v1): no gate-name or 7.0 pass-line literal outside services/quality/, every
      # gate / chip / Jev key / A1 code mapped to a class, YAML schema, path map, generated TS fresh.
      # Blocking on errors; the report (errors, warnings, qlint: allow) goes to the step summary.
      - name: Quality registry lint
        run: |
          set -o pipefail
          python -m services.quality.lint --report | tee -a "$GITHUB_STEP_SUMMARY"

  # AA-926 (design §4.6): report which quality tiers a change touches and the hash of its diff on the
  # quality paths (services/quality/paths.yaml). Report only — always green, not a required check; AA-919
  # makes it enforce `quality/q2`. Least privilege: no id-token, read-only contents.
  quality-paths:
    name: Quality Paths (report)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml==6.0.3 --quiet

      - name: Quality-path diff hash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 .github/scripts/quality_paths.py

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1 --quiet

      # AA-868: failing. Accepted findings live in .github/pip-audit-ignore.txt with an expiry date;
      # an expired entry or any finding not on the list turns this check red.
      - name: Audit main requirements (failing)
        run: bash .github/scripts/pip_audit_gate.sh requirements.txt


  # AA-1032 (faster CI): the unit suite runs as UNIT_SHARDS parallel jobs ("Unit shard i/N"), each on 4 pytest-xdist
  # workers; the required check keeps its name: "Unit Tests" below combines the shards' coverage, then runs the same
  # ratchet and Q0 steps as before. The split is by test file, balanced on .github/test-durations/unit.json
  # (.github/scripts/ci_shards.py; every file lands in exactly one shard, a new file weighs the median). Before
  # (10 main runs, 01/11/2026): one job, ~4.5-5 min, of which ~45 s was every worker importing all 667 files.
  test-unit-shard:
    name: Unit shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      UNIT_SHARDS: 3
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # AA-993 (CIS-3): uv installs the same requirements faster than pip; its cache replaces setup-python's pip cache.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        # requirements-dev.txt pins the coverage version (CI only; requirements.txt feeds the production image).
        run: |
          uv pip install --system -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests (this shard)
        env:
          # AA-993 (CIS-1): Python 3.12 sys.monitoring tracer, about 2x faster than the C tracer with the same
          # covered lines. Needs the coverage pin in requirements-dev.txt.
          COVERAGE_CORE: sysmon
          # The shard's coverage data; "Unit Tests" combines the shards' files (coverage combine) into the one report.
          COVERAGE_FILE: coverage-shards/.coverage.unit-${{ matrix.shard }}
          ENVIRONMENT: test
          AWS_REGION: us-west-1
          AWS_DEFAULT_REGION: us-west-1
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          OPENAI_API_KEY: sk-test-dummy
          JWT_SECRET: test-jwt-secret-ci-only-not-real
          DATAFORSEO_LOGIN: test
          DATAFORSEO_PASSWORD: test
          LANGFUSE_SECRET_KEY: test
          LANGFUSE_PUBLIC_KEY: test
          LANGFUSE_HOST: http://localhost:3000
        # AA-993 (CIS-2): 4 pytest-xdist workers (pinned in requirements-dev.txt), `--dist loadfile` keeps each test file
        # on one worker (module fixtures and module state stay per file). Same coverage targets as before; the terminal
        # and XML reports are written once, from the combined data, in "Unit Tests".
        run: |
          set -euo pipefail
          mapfile -t FILES < <(python3 .github/scripts/ci_shards.py files --shards "$UNIT_SHARDS" --index "$SHARD" \
            --workers 4 --file-overhead 0.07 --durations .github/test-durations/unit.json tests/unit tests/acp)
          echo "Unit shard $SHARD/$UNIT_SHARDS: ${#FILES[@]} test files"
          mkdir -p coverage-shards
          pytest "${FILES[@]}" -v \
            -n 4 --dist loadfile \
            --tb=short \
            --cov=services \
            --cov=shared \
            --cov-report= \
            --junitxml="junit-unit-$SHARD.xml" -o junit_family=xunit1

      - name: Upload the shard's coverage data and junit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-shard-${{ matrix.shard }}
          path: |
            coverage-shards/
            junit-unit-${{ matrix.shard }}.xml
          include-hidden-files: true    # the coverage data file is .coverage.unit-N
          if-no-files-found: error
          retention-days: 5

  test-unit:
    name: Unit Tests
    needs: test-unit-shard
    # Runs when a shard failed too, so the required check turns red instead of "skipped" (a skipped required check
    # counts as passed).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      UNIT_SHARDS: 3
    steps:
      - name: Every unit shard passed
        env:
          RESULT: ${{ needs.test-unit-shard.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::a unit shard did not pass (result: $RESULT); see the 'Unit shard i/N' jobs"
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          # AA-925: the Q0 red-on-base step needs the PR merge commit's first parent (the base tip).
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        # Q0 red on base runs pytest on the base tip; coverage comes from the pinned requirements-dev.txt.
        run: |
          uv pip install --system -r requirements.txt -r requirements-dev.txt

      - uses: actions/download-artifact@v8
        with:
          pattern: unit-shard-*
          merge-multiple: true
          path: shards

      # The shards ran on the same checkout path, so their data files combine as one run's would (same TOTAL; checked
      # on a two-shard split against a single run, AA-1032 notes). [tool.coverage.run] omit in pyproject.toml applies.
      - name: Combine coverage of the shards
        run: |
          set -euo pipefail
          FOUND=$(find shards/coverage-shards -name '.coverage.unit-*' | wc -l)
          if [ "$FOUND" -ne "$UNIT_SHARDS" ]; then
            echo "::error::expected $UNIT_SHARDS shard coverage files, found $FOUND"
            exit 1
          fi
          coverage combine --keep shards/coverage-shards
          # -i as pytest-cov reports (ignore_errors): a unit test builds a throwaway "services" package under /tmp
          # (test_collection_error_on_base); --cov=services measures it and its source is gone by now.
          coverage report -i --show-missing
          coverage xml -i -o coverage.xml

      # AA-879: coverage ratchet (replaces --cov-fail-under=30; the real total was ~86%). Fails below the
      # floor in .github/coverage-ratchet.json, or when a PR lowers that floor against the base tip (HEAD^1
      # of the pull_request merge ref; on a push or a merge_group run the base is the previous commit: the
      # base tip or the squash of the PR queued before it). Below the monthly goal only warns.
      - name: Coverage ratchet
        run: |
          BASE_ARGS=()
          if git rev-parse -q --verify HEAD^1 >/dev/null; then BASE_ARGS=(--base HEAD^1); fi
          python3 .github/scripts/coverage_ratchet.py coverage.xml "${BASE_ARGS[@]}"

      # AA-925 (Q-2): every NEW Q0 case (tests/unit/quality/cases) must FAIL on the base-branch tip, and an
      # existing truth label may change only with the `q0-relabel` PR label (labels are read from the event:
      # after adding the label, push a commit so the run sees it). HEAD^1 of the pull_request merge ref is
      # the base tip. See .github/scripts/q0_red_on_base.py.
      - name: Q0 red on base
        if: github.event_name == 'pull_request'
        env:
          ENVIRONMENT: test
          AWS_REGION: us-west-1
          AWS_DEFAULT_REGION: us-west-1
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          OPENAI_API_KEY: sk-test-dummy
          JWT_SECRET: test-jwt-secret-ci-only-not-real
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python .github/scripts/q0_red_on_base.py --base "$(git rev-parse HEAD^1)"

      # Report only: each shard's real seconds, and the per-file durations of this run as an artifact to refresh
      # .github/test-durations/unit.json when the shards drift apart.
      - name: Shard balance (report)
        if: ${{ !cancelled() }}
        run: |
          python3 .github/scripts/ci_shards.py durations --out unit-durations.json shards/junit-unit-*.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-durations-unit
          path: unit-durations.json
          if-no-files-found: ignore
          retention-days: 14

  # AA-1032 (faster CI): the integration suite runs as INTEGRATION_SHARDS parallel jobs ("Integration shard i/N"), each
  # with its OWN Postgres and Redis service, so each shard's conftest replays every migration on an empty database
  # (the session fixture) exactly as the single job did. Each shard is one CONSECUTIVE range of the path-ordered files
  # (--contiguous, balanced on .github/test-durations/integration.json): the modules are not independent (e.g.
  # test_aa712_migration_226 drops schema catalog and test_aa712_migration_228, next in order, re-creates it for every
  # later module), so a file keeps the predecessors it had in the single job; a longest-first split by file broke 9
  # modules that way (AA-1032 notes). A shard red on main at its FIRST files means a module leans on an earlier one's
  # leftovers: fix that module's setup. The required check keeps its name: "Integration Tests" below passes only when
  # every shard passed. Before (10 main runs, 01/11/2026): one job, ~4-4.5 min.
  test-integration-shard:
    name: Integration shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      INTEGRATION_SHARDS: 4
      SHARD: ${{ matrix.shard }}
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cistest
          POSTGRES_PASSWORD: cistest
          POSTGRES_DB: cis_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # AA-993 (CIS-3): same uv install as Unit Tests, two installs in the same order as before.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt
          uv pip install --system -r tests/integration/requirements-integration.txt

      - name: Setup test DB user
        run: |
          PGPASSWORD=cistest psql -h localhost -U cistest \
            -d cis_integration_test \
            -c "SELECT 1" 2>/dev/null || \
          PGPASSWORD=postgres psql -h localhost -U postgres \
            -c "CREATE USER cistest WITH PASSWORD 'cistest' SUPERUSER;" \
            -c "CREATE DATABASE cis_integration_test OWNER cistest;" 2>/dev/null || true
          PGPASSWORD=cistest psql -h localhost -U cistest -d cis_integration_test \
            -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN CREATE ROLE app_user LOGIN PASSWORD 'appuser123'; END IF; END \$\$;" || true

      - name: Run integration tests (this shard)
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql://cistest:cistest@localhost:5432/cis_integration_test
          REDIS_URL: redis://localhost:6379
          AWS_REGION: us-west-1
          AWS_DEFAULT_REGION: us-west-1
          OPENAI_API_KEY: sk-test-dummy
          JWT_SECRET: test-jwt-secret-ci-only-not-real
          DATAFORSEO_LOGIN: test
          DATAFORSEO_PASSWORD: test
          LANGFUSE_SECRET_KEY: test
          LANGFUSE_PUBLIC_KEY: test
          LANGFUSE_HOST: http://localhost:3000
        # test_007_rls_isolation.py stays out, as before (--ignore then, --exclude now).
        run: |
          set -euo pipefail
          mapfile -t FILES < <(python3 .github/scripts/ci_shards.py files --contiguous --shards "$INTEGRATION_SHARDS" \
            --index "$SHARD" --durations .github/test-durations/integration.json \
            --exclude tests/integration/test_007_rls_isolation.py tests/integration)
          echo "Integration shard $SHARD/$INTEGRATION_SHARDS: ${#FILES[@]} test files"
          pytest "${FILES[@]}" -v --tb=short -p no:cacheprovider \
            --junitxml="junit-integration-$SHARD.xml" -o junit_family=xunit1

      - name: Upload the shard's junit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: integration-shard-${{ matrix.shard }}
          path: junit-integration-${{ matrix.shard }}.xml
          if-no-files-found: ignore
          retention-days: 5

  test-integration:
    name: Integration Tests
    needs: test-integration-shard
    # Runs when a shard failed too, so the required check turns red instead of "skipped" (a skipped required check
    # counts as passed).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every integration shard passed
        env:
          RESULT: ${{ needs.test-integration-shard.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "::error::an integration shard did not pass (result: $RESULT); see the 'Integration shard i/N' jobs"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: integration-shard-*
          merge-multiple: true
          path: shards

      # Report only, as for the unit shards: real seconds per shard and the per-file durations of this run.
      # tests/integration/pytest.ini makes that folder pytest's rootdir, so the junit paths lack it: --prefix puts it
      # back, or the refreshed file would match no discovered file and the split would fall back to file counts.
      - name: Shard balance (report)
        run: |
          python3 .github/scripts/ci_shards.py durations --prefix tests/integration/ \
            --out integration-durations.json shards/junit-integration-*.xml | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: test-durations-integration
          path: integration-durations.json
          if-no-files-found: ignore
          retention-days: 14

  # AA-993 M4b (root ADR 0017 d1, design D2.1; critic 7, 17): "Migration preflight". Tells the author of a PR that
  # adds a migration whether it will be auto-applied (header `-- migrate: expand`, lint clean, classify evidence
  # expand) or needs a person (contract / destructive: MIG-4), and refuses: an edit/delete of a file already copied to
  # AA-CIS-Infra, a number other than main max + 1 (label migration:out-of-order for a reserved one), a readiness raise
  # to a non-expand file or to a key with no file, a runner/ownership lint error, an expand header the classify replay
  # contradicts. Tools: AA-CIS-Infra db/run_migration.py --inspect, db/check_migration_ownership.py and
  # db/expand_check.py --classify at the pinned INFRA_TOOLS_SHA (public repo, anonymous clone; bump the pin when the
  # Infra runner changes). The Infra copy PR's required "Expand classify" and Migration Apply's re-classify stay the
  # authority. Runs on pull_request and merge_group (the queue re-checks the number on the latest main); exits at once
  # when the PR touches no migration and no readiness key. Logic: .github/scripts/migration_preflight.py.
  # Same steps in AA-CIS-App, AA-Booking and AA-Partner; only the env block differs.
  migration-preflight:
    name: Migration preflight
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: read    # the PR's labels (migration:out-of-order), read live
    defaults:
      run:
        working-directory: .
    env:
      OWNER: cis
      MIG_DIR: api/migrations
      READINESS_FILE: api/core/readiness.py
      # Public readiness of Dev: registered_keys tell whether a lower key of this owner still waits for a person.
      READY_URL: https://api-cis.lumiguides.it.com/health/ready
      INFRA_REPO: AdventureAsia365-Ecosys/AA-CIS-Infra
      # AA-CIS-Infra main after M3 (#493/#494): run_migration.py with the expand lint, expand_check.py --classify.
      INFRA_TOOLS_SHA: 3b999913ba990e5e2ca8d3fbd8efb4d44980ca76
      # pgvector/pgvector:0.8.1-pg15, the image of the Infra classify and DB Schema Dump replay.
      REPLAY_IMAGE: pgvector/pgvector@sha256:94aee7e88f98125114657cab98e28c5dfa8dd517a6bf83fd98b503439f1e3de6
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: What the PR changes
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_REF: ${{ github.event.merge_group.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The label is read live in both cases (not from the event payload): adding migration:out-of-order and
          # "Re-run jobs" is enough, no empty commit needed.
          if [ "$EVENT" = "merge_group" ]; then
            BASE="$GROUP_BASE"
            git fetch --quiet --depth=1 origin "$BASE"
            PR=$(sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<<"$GROUP_REF")
          else
            BASE=$(git rev-parse HEAD^1)    # the merge commit's first parent = the base this PR is tested on
            PR="$PR_NUMBER"
          fi
          OOO=false
          if [ -n "$PR" ] && gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' \
              | grep -qx 'migration:out-of-order'; then OOO=true; fi
          git diff --name-status --no-renames "$BASE" HEAD -- "$MIG_DIR" "$READINESS_FILE" | tee changes.txt
          ADDED=$(grep -cE "^A[[:space:]]+${MIG_DIR}/[0-9]{3}_[^/]*\.sql$" changes.txt || true)
          {
            echo "base=$BASE"
            echo "ooo=$OOO"
            echo "relevant=$([ -s changes.txt ] && echo true || echo false)"
            echo "added=$ADDED"
          } >> "$GITHUB_OUTPUT"

      - name: Pinned AA-CIS-Infra tools and the Infra copy list
        id: infra
        if: steps.scope.outputs.relevant == 'true'
        run: |
          set -uo pipefail
          git init -q infra && git -C infra remote add origin "https://github.com/$INFRA_REPO.git"
          if git -C infra fetch -q --depth 1 origin "$INFRA_TOOLS_SHA" && git -C infra checkout -q FETCH_HEAD; then
            echo "tools=infra" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AA-CIS-Infra $INFRA_TOOLS_SHA not readable (private?): header only, no runner lint"
          fi
          mkdir -p infra-main
          if git -C infra fetch -q --depth 1 origin main && git -C infra archive FETCH_HEAD db/migrations | tar -x -C infra-main; then
            echo "copies=infra-main/db/migrations/$OWNER" >> "$GITHUB_OUTPUT"
            echo "AA-CIS-Infra main: $(git -C infra rev-parse --short FETCH_HEAD)"
          else
            echo "::warning::AA-CIS-Infra main not readable: every migration on main counts as copied"
          fi

      - name: Classify the added files (expand post-check on a replay of Dev)
        id: classify
        if: steps.scope.outputs.added != '0' && steps.infra.outputs.tools == 'infra' && steps.infra.outputs.copies != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          python -m pip install --quiet asyncpg==0.30.0 pyyaml==6.0.2
          # Each owner's main with the Infra copies laid over it (as Migration Apply does); this PR's folder for its owner.
          declare -A SRC=([cis]="AA-CIS-App api/migrations" [booking]="AA-Booking migrations"
                          [tripplanner]="AA-TripPlanner-Web migrations" [crm]="AA-Partner api/migrations")
          ARGS=(--source roles=infra-main/db/migrations/roles)
          for o in cis booking tripplanner crm; do
            mkdir -p "replay/$o"
            if [ "$o" = "$OWNER" ]; then
              cp "$MIG_DIR"/*.sql "replay/$o/"
            else
              read -r repo dir <<<"${SRC[$o]}"
              git clone --quiet --depth 1 --filter=blob:none --sparse "https://github.com/AdventureAsia365-Ecosys/$repo.git" "owners/$o"
              git -C "owners/$o" sparse-checkout set "$dir"
              cp "owners/$o/$dir"/*.sql "replay/$o/"
              cp infra-main/db/migrations/"$o"/*.sql "replay/$o/" 2>/dev/null || true
            fi
            ARGS+=(--source "$o=replay/$o")
          done
          RUN=$(gh run list -R "$INFRA_REPO" --workflow db-schema-dump.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
          if [ -n "$RUN" ] && gh run download "$RUN" -R "$INFRA_REPO" -n "db-schema-dump-$RUN" -D dump 2>/dev/null \
              && [ -s dump/schema.json ]; then
            ARGS+=(--live dump/schema.json); echo "replay order: the live dump of AA-CIS-Infra DB Schema Dump run $RUN"
          else
            echo "::notice::no AA-CIS-Infra DB Schema Dump artifact readable: the replay falls back to number order"
          fi
          ARGS+=(--files)
          while read -r f; do ARGS+=("$OWNER/$(basename "$f")"); done \
            < <(grep -E "^A[[:space:]]+${MIG_DIR}/[0-9]{3}_[^/]*\.sql$" changes.txt | cut -f2)
          PW="$(openssl rand -hex 16)"
          docker run -d --name classify-db -e POSTGRES_PASSWORD="$PW" -p 127.0.0.1:55432:5432 "$REPLAY_IMAGE" >/dev/null
          for _ in $(seq 1 60); do docker exec classify-db pg_isready -h 127.0.0.1 -U postgres -q && break; sleep 2; done
          python3 infra/db/expand_check.py --classify "${ARGS[@]}" \
            --admin-dsn "postgresql://postgres:${PW}@127.0.0.1:55432/postgres" \
            --out classify.json --summary "$GITHUB_STEP_SUMMARY" > classify.log 2>&1
          STATUS=$?
          grep -v '^REPLAY ok' classify.log || true
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          docker rm -f classify-db >/dev/null 2>&1 || true

      - name: Preflight verdict
        env:
          BASE: ${{ steps.scope.outputs.base }}
          TOOLS: ${{ steps.infra.outputs.tools }}
          COPIES: ${{ steps.infra.outputs.copies }}
          CLASSIFY_STATUS: ${{ steps.classify.outputs.status }}
          OOO: ${{ steps.scope.outputs.ooo }}
        run: |
          ARGS=(--app "$OWNER" --migrations-dir "$MIG_DIR" --readiness-file "$READINESS_FILE" --base "$BASE")
          [ -n "$TOOLS" ] && ARGS+=(--infra-tools "$TOOLS")
          [ -n "$COPIES" ] && ARGS+=(--infra-copies "$COPIES")
          [ -s classify.json ] && ARGS+=(--classify-json classify.json)
          [ -n "$CLASSIFY_STATUS" ] && ARGS+=(--classify-status "$CLASSIFY_STATUS")
          [ "$OOO" = "true" ] && ARGS+=(--allow-out-of-order)
          python3 .github/scripts/migration_preflight.py "${ARGS[@]}" --ready-url "$READY_URL"

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            --tag aa-cis-api:ci-${{ github.sha }} \
            --file Dockerfile \
            .

      - name: Verify image exists
        run: |
          docker image inspect aa-cis-api:ci-${{ github.sha }}
          echo "Image built successfully ✅"

      # AA-879: the image scan is blocking (it was report-only since AA-177). It fails on any CRITICAL/HIGH
      # finding that HAS a fix (`ignore-unfixed`): the fix is a dependency bump or a rebuilt base image.
      # Reviewed report before the flip (main run 39633516311, 21/10/2026): 145 OS findings (debian 13),
      # none with a fixed version; Python packages clean. An accepted fixable finding goes into .trivyignore
      # with a reason and an `exp:` date (checked by the step below; at most 90 days ahead).
      - name: Trivy ignore entries carry a reason and an expiry
        run: python3 .github/scripts/check_trivyignore.py .trivyignore

      - name: Scan image for vulnerabilities (Trivy, failing on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "aa-cis-api:ci-${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          trivyignores: ".trivyignore"
          exit-code: "1"

      # sbom-action auto-uploads its own GitHub Actions artifact when it detects it's running
      # in a GHA workflow (its documented default behavior) -- artifact-name below controls
      # that upload's name directly, no separate actions/upload-artifact step needed.
      - name: Generate SBOM (syft, CycloneDX)
        uses: anchore/sbom-action@v0.24.3
        with:
          image: "aa-cis-api:ci-${{ github.sha }}"
          format: cyclonedx-json
          output-file: sbom-${{ github.sha }}.cdx.json
          artifact-name: sbom-${{ github.sha }}.cdx.json

  # AA-732 — frontend ESLint (UI-kit conventions). AA-994 S1c (root ADR 0016 decision 7, plan guards G1-G9, G11): a
  # real gate now, no continue-on-error, meant to be a REQUIRED check (branch protection, plan hand step H2). Page code
  # is linted with the kit preset (app/_kit/core/eslint-kit.mjs) at `error`; violations that existed before S1c are
  # frozen in frontend/eslint-suppressions.json (ESLint bulk suppressions), which may only shrink:
  #   1. the kit rules' own RuleTester suite;
  #   2. `eslint --prune-suppressions`: fails on any violation not covered by the file, and rewrites the file to the
  #      violations that still exist;
  #   3. the committed file must equal the pruned one (a fix that did not prune its entries fails here);
  #   4. no entry and no rule total may grow against the base branch's file (a `--suppress-all` that hides new
  #      violations fails here), a new entry may only carry a deleted/renamed file's violations into a file the base
  #      did not have, and no entry may name a deleted file; a rule the change switches on (scripts/kit-new-rules.mjs,
  #      AA-994 S6a) starts its baseline once, then only shrinks like the others;
  #   5. no inline `eslint-disable` of a kit rule (or bare `eslint-disable`) in page code: the suppressions file is the
  #      only baseline.
  # Steps 3-5 run even when step 2 fails, so one run shows every reason.
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Kit lint rules (RuleTester)
        run: node --test --no-warnings lib/eslintKit.test.mjs

      - name: ESLint (kit preset at error, suppressions pruned)
        id: eslint
        run: |
          set +e
          npx eslint --prune-suppressions 2>&1 | tee lint-output.txt
          STATUS=${PIPESTATUS[0]}
          SUMMARY_LINE=$(grep -E "problems? \(" lint-output.txt | tail -n1)
          {
            echo "### Frontend ESLint"
            echo ""
            echo "${SUMMARY_LINE:-No unsuppressed problems.}"
            echo ""
            echo "_Kit rules at error (root ADR 0016 decision 7); pre-existing violations are frozen in frontend/eslint-suppressions.json, which only shrinks._"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Suppressions file is pruned
        if: ${{ !cancelled() && steps.eslint.conclusion != 'skipped' }}
        run: |
          if ! git diff --exit-code -- eslint-suppressions.json; then
            echo "::error file=frontend/eslint-suppressions.json::Violations were fixed but their suppressions were not removed. Run 'npx eslint --prune-suppressions' in frontend/ and commit eslint-suppressions.json (the diff above)."
            exit 1
          fi
          git checkout -- eslint-suppressions.json

      - name: Suppressions do not grow
        if: ${{ !cancelled() && steps.eslint.conclusion != 'skipped' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          case "$BASE_SHA" in
            ""|0000000000000000000000000000000000000000)
              echo "::notice::No base commit for this event: suppressions growth check skipped."
              exit 0 ;;
          esac
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          BASE_FILE="$RUNNER_TEMP/base-eslint-suppressions.json"
          if ! git show "$BASE_SHA:frontend/eslint-suppressions.json" > "$BASE_FILE" 2>/dev/null; then
            echo "::notice::The base commit has no frontend/eslint-suppressions.json (this change creates the baseline): growth check skipped."
            exit 0
          fi
          BASE_LIST="$RUNNER_TEMP/base-frontend-files.txt"
          git ls-tree -r --name-only "$BASE_SHA" -- . > "$BASE_LIST"  # paths relative to frontend/ (the cwd)
          # A rule this change switches on (on at the head, off at the base for every file listing it, AA-994 S6a) may
          # freeze its existing violations once; fails closed (no --new-rules) when the base config cannot be rebuilt.
          NEW_RULES=$(node scripts/kit-new-rules.mjs "$BASE_SHA") || { echo "::warning::kit-new-rules failed: every rule must shrink"; NEW_RULES=""; }
          if [ -n "$NEW_RULES" ]; then echo "Rules switched on by this change: $NEW_RULES"; fi
          node app/_kit/core/check-kit-copy.mjs --suppressions "$BASE_FILE" eslint-suppressions.json --base-files "$BASE_LIST" \
            ${NEW_RULES:+--new-rules "$NEW_RULES"}

      - name: No inline disable of a kit rule
        if: ${{ !cancelled() }}
        run: node app/_kit/core/check-kit-copy.mjs --no-kit-disable app --ignore _kit

  # AA-879 — type-check and production build of the admin app (frontend/). NEW job, meant to become a
  # required check: tsc catches prop/type errors ESLint misses, and `next build` catches what only a build
  # sees (server/client boundaries, route config, Turbopack). Builds without any secret or env var (the
  # app reads its API URL and Cognito settings at runtime); Sentry source-map upload is skipped without
  # SENTRY_AUTH_TOKEN. ESLint runs in the separate "Frontend Lint" job (a gate since AA-994 S1c).
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # AA-994 S1a (root ADR 0016 decision 5): the canonical UI kit core (app/_kit/core) — MANIFEST.json current,
      # every file with the header line, imports closed (only ./ files of core and the allowed packages). Then its
      # unit test (copy check on edited / missing / extra files, theme store). Both are dependency-free: before npm ci.
      # AA-994 S1b (decision 4, plan guards G10 + G15): no `--aa-*` definition in any CSS file but core/tokens.css, and
      # the WCAG contrast matrix of core/tokens.css (every checked text pair, light + dark, and the photo scrim).
      - name: Kit core self-check
        run: |
          node app/_kit/core/check-kit-copy.mjs --self
          node app/_kit/core/check-kit-copy.mjs --css .
          node --test --experimental-strip-types --no-warnings lib/kitCore.test.mjs lib/tokensContrast.test.mjs

      - name: Install dependencies
        run: npm ci

      # AA-994 (button variants): render the kit core with react-dom/server and check the accessible markup (roles,
      # aria-checked / selected / pressed, one tab stop), the focus styles, and that primitives re-exports every
      # Buttons export (the consumer barrels `export *` from primitives). Needs typescript + react, so after npm ci.
      - name: Kit button render tests
        run: node --test --experimental-strip-types --no-warnings lib/kitButtons.test.mjs

      - name: Type-check (tsc --noEmit)
        run: npx tsc --noEmit -p .

      - name: Build (next build)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
