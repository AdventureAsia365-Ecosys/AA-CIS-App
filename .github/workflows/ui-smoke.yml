name: UI Smoke

# AA-732 — the Playwright UI smoke suite against a deployed CIS admin host.
# Called by deploy-admin-dev.yml after a verified ECS deploy from main (AA-911: the Vercel previews and the
# vercel-deploy.yml caller were retired in S272), or dispatched. Inside a called workflow `github.event_name` /
# `github.event` belong to the CALLER, so everything here reads `inputs.*`, never the event payload.
#
# AA-816 S2 path — two jobs:
#   • `smoke` (always): Playwright project `smoke-public`, every smoke spec without the @staff tag, NO session.
#   • `smoke-staff` (only with staff_session=true, from main): project `smoke` (+ its setup) signed in as the
#     Cognito E2E user "E2E Cognito" with an email code read from the SES mailbox (same OIDC role, environment `e2e`
#     and concurrency group as e2e-cognito.yml). Only on the Cognito callback host https://aa-cis.lumiguides.it.com
#     (the E2E user is a reviewer: read-only checks only). Uploads screenshots only: the HTML report would name the
#     typed code in a `fill` step.
on:
  workflow_call:
    inputs:
      base_url:
        description: "Deployment URL to run the smoke against"
        required: true
        type: string
      sha:
        description: "Commit to check out and to find the PR by (the PR head sha)"
        required: false
        type: string
        default: ""
      staff_session:
        description: "AA-816: also run the authenticated smoke (Cognito E2E user; main only, callback hosts only)"
        required: false
        type: boolean
        default: false
    secrets:
      # the read-only mailbox role of the E2E sign-in (the caller passes `secrets: inherit`; declared so the called
      # workflow names every secret it reads, actionlint G15)
      E2E_MAIL_ROLE_ARN:
        required: false
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to run the smoke against (e.g. https://aa-cis.lumiguides.it.com)"
        required: true
        type: string
      sha:
        description: "Optional commit sha to check out and comment on (default: the dispatched ref)"
        required: false
        type: string
        default: ""
      staff_session:
        description: "AA-816: also run the authenticated smoke as the Cognito E2E user (dispatch from main; base_url must be https://aa-cis.lumiguides.it.com)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  # One run per deployment URL; a re-run on the same URL cancels the in-flight one.
  group: ui-smoke-${{ inputs.base_url }}
  cancel-in-progress: true

jobs:
  smoke:
    name: UI smoke (Playwright)
    # Pinned (S252, 26/10/2026): ubuntu-latest moved to 26.04 and Playwright does not support Chromium there yet.
    runs-on: ubuntu-24.04
    # Both triggers carry inputs.base_url (the caller only calls after a verified deploy).
    if: inputs.base_url != ''
    env:
      BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Checkout the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deployed commit (from deploy-admin-dev.yml); the dispatched ref otherwise.
          ref: ${{ inputs.sha || github.sha }}

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      # `npm install`, not `npm ci`: the repo root's package-lock.json is gitignored, so `npm ci` fails
      # (first live dispatch, S220). The only root dependency is @playwright/test.
      - name: Install dependencies (repo root — Playwright lives here)
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # AA-816 S2 path: no session here (the @staff specs run in job smoke-staff).
      - name: Run the public UI smoke project (no session)
        run: npx playwright test --project=smoke-public -c playwright.config.ts

      - name: Upload smoke artifacts (screenshots + HTML report only — NO auth state)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-${{ github.run_id }}
          # Only screenshots and the HTML report. Never upload tests/e2e/.auth (session cookies).
          path: |
            tests/e2e/results/smoke/**/*.png
            tests/e2e/results/smoke/playwright-report/
          if-no-files-found: warn
          retention-days: 14

      # ── Find the PR for the deployed sha and post/update ONE comment ──
      # All values reach `run:` through env (never `${{ }}` interpolation inside the script).
      - name: Find PR for the deployed sha
        if: always()
        id: findpr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "Found PR: ${PR:-none}"

      - name: Comment smoke result on the PR
        if: always() && steps.findpr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.findpr.outputs.pr }}
          OUTCOME: ${{ job.status }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          MARKER="<!-- ui-smoke-report -->"
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          if [ "$OUTCOME" = "success" ]; then STATUS="✅ passed"; else STATUS="❌ failed"; fi
          BODY=$(printf '%s\n### UI smoke — %s\n\nHost: %s\n\n[Run & artifacts (screenshots + HTML report)](%s)\n' \
                   "$MARKER" "$STATUS" "${BASE_URL:-n/a}" "$RUN_URL")
          # Find an existing marker comment and edit it in place; otherwise create one.
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" \
                       --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" 2>/dev/null | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
            echo "Updated comment $EXISTING"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
            echo "Created a new comment"
          fi

      # Scrub the Playwright auth storage state (live session cookies) regardless of outcome, so it
      # never lingers on the runner or leaks into any later step/artifact.
      - name: Delete auth state
        if: always()
        run: rm -rf tests/e2e/.auth

  # ── AA-816 S2 path: authenticated smoke as the Cognito E2E user (callback host only, main only) ──
  smoke-staff:
    name: UI smoke, signed in (Cognito E2E user)
    # Pinned (S252, 26/10/2026): ubuntu-latest moved to 26.04 and Playwright does not support Chromium there yet.
    runs-on: ubuntu-24.04
    # The mailbox role trusts refs/heads/main + environment e2e only. Inside a called workflow github.ref is the
    # caller's ref (a push to main, or a dispatch from main).
    if: inputs.base_url != '' && inputs.staff_session && github.ref == 'refs/heads/main'
    environment: e2e
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    # Shared with e2e-cognito.yml: two runs at once would race for the same mailbox and the same user's codes.
    concurrency:
      group: e2e-cognito
      cancel-in-progress: false
    env:
      BASE_URL: ${{ inputs.base_url }}
      # Opt-in switch the smoke setup checks (no underscore by design, like e2e-cognito.yml).
      E2ECOGNITO: "1"
    steps:
      - name: Only the Cognito callback host
        env:
          URL: ${{ inputs.base_url }}
        run: |
          case "${URL%/}" in
            https://aa-cis.lumiguides.it.com) echo "Staff smoke on $URL" ;;
            *) echo "::error::staff_session needs base_url https://aa-cis.lumiguides.it.com (got $URL)"; exit 1 ;;
          esac

      - name: Checkout the deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}

      - name: Configure AWS credentials (OIDC, read-only mailbox role)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.E2E_MAIL_ROLE_ARN }}
          aws-region: us-west-1
          role-session-name: cis-ui-smoke-staff-${{ github.run_id }}

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      # `npm install`, not `npm ci`: the repo root's package-lock.json is gitignored (S220 lesson).
      - name: Install dependencies (repo root — Playwright lives here)
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # `smoke` pulls in `smoke-setup` (the Cognito sign-in); `smoke-public` runs on the same host without a session.
      - name: Run the signed-in UI smoke (+ the public specs)
        run: npx playwright test --project=smoke --project=smoke-public -c playwright.config.ts

      # Screenshots only. NOT the HTML/JSON reports: a `fill` step title would carry the typed sign-in code.
      - name: Upload smoke screenshots (NO report, NO auth state)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-smoke-staff-${{ github.run_id }}
          path: tests/e2e/results/smoke/**/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Find PR for the deployed sha
        if: always()
        id: findpr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.sha || github.sha }}
        run: |
          PR=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[0].number // empty' 2>/dev/null || true)
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "Found PR: ${PR:-none}"

      - name: Comment the signed-in smoke result on the PR
        if: always() && steps.findpr.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.findpr.outputs.pr }}
          OUTCOME: ${{ job.status }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          MARKER="<!-- ui-smoke-staff-report -->"
          RUN_URL="$SERVER_URL/$REPO/actions/runs/$RUN_ID"
          if [ "$OUTCOME" = "success" ]; then STATUS="✅ passed"; else STATUS="❌ failed"; fi
          BODY=$(printf '%s\n### UI smoke, signed in (Cognito E2E user) — %s\n\nHost: %s\n\n[Run & screenshots](%s)\n' \
                   "$MARKER" "$STATUS" "${BASE_URL:-n/a}" "$RUN_URL")
          EXISTING=$(gh api "repos/$REPO/issues/$PR/comments" \
                       --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" 2>/dev/null | head -n1 || true)
          if [ -n "$EXISTING" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$EXISTING" -f body="$BODY" >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY" >/dev/null
          fi

      # The storage state holds live session cookies: scrub it regardless of outcome.
      - name: Delete auth state
        if: always()
        run: rm -rf tests/e2e/.auth
