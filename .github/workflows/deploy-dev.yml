name: Deploy Dev
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'shared/**'
      - 'services/**'
      - 'worker/**'
      - 'Dockerfile'
      - 'requirements.txt'
      # AA-891: a release PR (release-please) changes only CHANGELOG.md, .release-please-manifest.json and
      # api/version.py. The first two are not listed above; this negation (it must stay after 'api/**') drops the
      # third, so merging a release PR does not restart api/worker. The next code merge ships the new version.
      - '!api/version.py'
      # AA-879: no 'frontend/**' — the image holds no frontend file (see the Dockerfile COPY lines), so a
      # frontend-only merge must not restart api/worker. The admin app deploys from vercel-deploy.yml.
  workflow_dispatch:
    inputs:
      override_running_jobs:
        description: "AA-725 — reason to deploy anyway while jobs are queued/running (Nghiệp only). Leave empty to respect the guard."
        required: false
        type: string
permissions:
  id-token: write
  contents: read
# AA-868: one CIS deploy at a time (40/550 runs overlapped before; one failed on the same-SHA step).
# Queued, never cancelled: a later merge waits for the running roll instead of killing it.
concurrency:
  group: deploy-dev-cis
  cancel-in-progress: false
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
jobs:
  # AA-725 part 1 — pre-deploy guard. A deploy restarts the api/worker containers; any job that is
  # queued or running would be interrupted (S212: 3 PRs merged mid Thailand wave killed 16 S1
  # jobs). CI has no RDS access (private subnet), so it asks the LIVE api, which counts shared.job
  # with no time filter. The guard blocks the roll when a job is active, unless a workflow_dispatch
  # run supplied `override_running_jobs` with a reason (logged below). Kinds registered with
  # `deploy_gate_exempt` (AA-832; no kind uses it since AA-751) are not counted; the response lists
  # them in `exempt_kinds`.
  preflight:
    name: Pre-deploy job guard
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5
      # Fails closed (AA-868): a missing secret or an unreachable gate blocks the roll; an
      # override reason lets it through (also the way out when the API itself is down).
      - name: Check for queued/running jobs
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          OVERRIDE: ${{ inputs.override_running_jobs }}
          GATE_URL: https://api-cis.lumiguides.it.com/admin/job-runner/deploy-gate
        run: bash .github/scripts/deploy_job_guard.sh

  build-and-push:
    name: Build and Push ECR
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      # AA-725 part 5 — export only the per-commit TAG (dev-<sha>), never the full image. The full
      # image embeds ECR_REGISTRY, which is a repo secret, and GitHub drops any job output that
      # contains a secret value ("Skip output 'image' since it may contain secret") — that left
      # DEPLOY_IMAGE empty downstream. The tag has no secret, so it survives; the deploy job
      # rebuilds the full image from its own ECR_REGISTRY/ECR_REPOSITORY env.
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, push image
        id: build
        run: |
          # AA-725 part 5 — deploy by the IMMUTABLE per-commit tag, not `:latest`. `:latest` is a
          # moving tag: api and worker register their task definitions at different moments, and a
          # second push landing in between would leave them on two different SHAs even though both
          # task defs say `:latest`. The deploy job pins this exact tag for BOTH services so they
          # always share one SHA. AA-869: `:latest` is no longer pushed (the repo becomes IMMUTABLE,
          # where a moving tag cannot be re-pushed); the frozen `:latest` left in ECR is only the
          # placeholder image of the Terraform task definitions, which the services ignore.
          IMAGE_TAG=dev-${{ github.sha }}
          FULL_IMAGE=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          # An immutable tag cannot be pushed twice: a re-run or a dispatch of a commit that was already
          # built (S241 run 39036415606 failed on exactly that) reuses the image already in ECR.
          if aws ecr describe-images --repository-name "${{ env.ECR_REPOSITORY }}" \
               --image-ids imageTag="$IMAGE_TAG" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "Image $IMAGE_TAG already in ECR — reusing it, no build."
          else
            docker build --build-arg GIT_SHA=${{ github.sha }} -t $FULL_IMAGE .
            docker push $FULL_IMAGE
          fi
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
  deploy:
    name: Deploy to ECS Dev
    runs-on: ubuntu-latest
    environment: dev
    needs: [build-and-push, preflight]
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
      # AA-651 — the worker runs the SAME image as the api on its own ECS service. The real
      # services are `aa-cis-dev-api` (api) and `aa-cis-dev-worker` (worker). ECS_SERVICE is
      # `aa-cis-dev-api`, so the worker name is the api name with its `-api` suffix replaced by
      # `-worker` — NOT `${ECS_SERVICE}-worker` (that gave `aa-cis-dev-api-worker`, which never
      # matched, so every deploy silently skipped the worker and it stayed on an old image).
      - name: Derive worker service name
        run: echo "ECS_WORKER_SERVICE=${ECS_SERVICE%-api}-worker" >> "$GITHUB_ENV"
        env:
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      # AA-725 part 5 — build the immutable image from the per-commit TAG (from build-and-push, no
      # secret) plus this job's own ECR_REGISTRY/ECR_REPOSITORY env, and export it for every step
      # below via $GITHUB_ENV. We cannot pass the full image as a job output: it embeds the
      # ECR_REGISTRY secret, so GitHub drops the output and DEPLOY_IMAGE would be empty.
      - name: Resolve deploy image
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          echo "DEPLOY_IMAGE=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:?tag not set}" >> "$GITHUB_ENV"
      - name: Install jq
        run: sudo apt-get install -y jq
      # AA-651 — register a fresh task definition for one family with the new image, then point
      # its service at it. Reused for both api and worker. Both families are created by Terraform
      # (modules/ecs); this only ever bumps the image on the latest revision, preserving every
      # other field (command override, env, secrets, stopTimeout) that Terraform set.
      - name: Deploy helper
        run: |
          cat > /tmp/deploy_family.sh <<'SH'
          set -euo pipefail
          FAMILY="$1"; SERVICE="$2"
          # AA-725 part 5 — pin the exact per-commit image passed by the deploy steps (DEPLOY_IMAGE),
          # not `:latest`, so api and worker are guaranteed to roll the SAME SHA in one deploy.
          NEW_IMAGE="${DEPLOY_IMAGE:?DEPLOY_IMAGE not set}"
          # --desired-count 1 on purpose: it wakes a service scaled to 0 (cost stop) so the roll
          # has a task to replace; Dev runs one task per service (AA-868 kept this).
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$SERVICE" \
            --desired-count 1 --region "$AWS_REGION" >/dev/null
          aws ecs describe-task-definition --task-definition "$FAMILY" --region "$AWS_REGION" \
            --query 'taskDefinition' --output json | \
          jq --arg img "$NEW_IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.placementConstraints,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) | .containerDefinitions[0].image = $img' \
          > /tmp/td_${FAMILY}.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td_${FAMILY}.json \
            --region "$AWS_REGION" --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $FAMILY: ${NEW_ARN##*/}"  # family:revision only; the ARN carries the account id (public repo)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_ARN" --region "$AWS_REGION" >/dev/null
          SH
          chmod +x /tmp/deploy_family.sh
      - name: Deploy api
        run: /tmp/deploy_family.sh "${{ env.ECS_SERVICE }}" "${{ env.ECS_SERVICE }}"
      # AA-651 — the worker family/service is created by AA-CIS-Infra. Until that applies, skip
      # the worker roll gracefully instead of failing the whole deploy (breaks the chicken-and-egg
      # on first rollout: the image must exist before Infra can create the worker service, and the
      # service must exist before this step can roll it). Once it exists, this deploys it normally.
      - name: Deploy worker
        run: |
          if aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" \
               --services "${{ env.ECS_WORKER_SERVICE }}" --region "${{ env.AWS_REGION }}" \
               --query 'services[?status==`ACTIVE`].serviceName' --output text | grep -q .; then
            /tmp/deploy_family.sh "${{ env.ECS_WORKER_SERVICE }}" "${{ env.ECS_WORKER_SERVICE }}"
          else
            echo "Worker service ${{ env.ECS_WORKER_SERVICE }} not found yet (AA-CIS-Infra not applied) — skipping."
          fi
      - name: Wait stable
        run: |
          SERVICES="${{ env.ECS_SERVICE }}"
          if aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" \
               --services "${{ env.ECS_WORKER_SERVICE }}" --region "${{ env.AWS_REGION }}" \
               --query 'services[?status==`ACTIVE`].serviceName' --output text | grep -q .; then
            SERVICES="$SERVICES ${{ env.ECS_WORKER_SERVICE }}"
          fi
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services $SERVICES \
            --region ${{ env.AWS_REGION }}
          echo "ECS deployment stable ($SERVICES)"

  # AA-993 V1 (ADR 0016 D3) — the post-deploy checks (api/worker same image SHA, the live smoke rows, the worker
  # rows) moved to post-deploy-verify.yml, which is also dispatchable on its own. It runs only when `deploy`
  # succeeded; `result` below turns a skipped or failed verify red.
  verify:
    name: Post-deploy verify
    needs: deploy
    uses: ./.github/workflows/post-deploy-verify.yml
    with:
      expected_sha: ${{ github.sha }}
      from_deploy: true
    secrets: inherit

  # AA-993 V1 — the run's verdict. GitHub shows a skipped job grey, not red, so without this a failed or skipped
  # preflight/build/deploy (verify then skips) could look like "nothing to verify". Every job here must succeed;
  # skipped, failed or cancelled is red on every event (no job in this workflow is conditional).
  result:
    name: Deploy Dev result
    runs-on: ubuntu-latest
    if: always()
    needs: [preflight, build-and-push, deploy, verify]
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$BAD" ] || [ "$(echo "$NEEDS" | jq 'length')" -lt 4 ]; then
            echo "::error::Deploy Dev ($EVENT) is not verified: ${BAD:-a job result is missing}"
            exit 1
          fi
          echo "Deploy Dev ($EVENT): deployed and verified."

  # S240: the "Deploy Frontend to Vercel" job (deploy hook on every Deploy Dev run) was removed — it added a
  # second production deployment per merge and used up the Hobby cap (~100 deployments / 24 h, team-wide;
  # canceled deployments count too). S241: frontend deploys (preview + production) now come only from
  # .github/workflows/vercel-deploy.yml; the Vercel Git integration is off (frontend/vercel.json).
