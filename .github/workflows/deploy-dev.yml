name: Deploy Dev
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'shared/**'
      - 'services/**'
      - 'worker/**'
      - 'Dockerfile'
      - 'requirements.txt'
      # AA-891: a release PR (release-please) changes only CHANGELOG.md, .release-please-manifest.json and
      # api/version.py. The first two are not listed above; this negation (it must stay after 'api/**') drops the
      # third, so merging a release PR does not restart api/worker. The next code merge ships the new version.
      - '!api/version.py'
      # AA-993 M4b (root ADR 0017 d7): a merged migration file alone does not restart api/worker (the runtime never
      # reads api/migrations/; the schema is applied by AA-CIS-Infra). Code that needs it waits at `schema-gate`.
      - '!api/migrations/**'
      # AA-879: no 'frontend/**' — the image holds no frontend file (see the Dockerfile COPY lines), so a
      # frontend-only merge must not restart api/worker. The admin app deploys from deploy-admin-dev.yml.
  workflow_dispatch:
    inputs:
      override_running_jobs:
        description: "AA-725 — reason to deploy anyway while a rerun wave is open or a deploy-blocking job runs (AA-993 G5; Nghiệp only). Leave empty to respect the guard."
        required: false
        type: string
      drill_force_smoke_fail:
        description: "AA-1193 drill — deploy normally, then force the post-deploy verify red so the automatic rollback runs. Needs main ahead of what Dev runs (merge a commit that does not deploy first)."
        required: false
        type: boolean
        default: false
permissions:
  id-token: write
  contents: read
# AA-868: one CIS deploy at a time (40/550 runs overlapped before; one failed on the same-SHA step).
# Queued, never cancelled: a later merge waits for the running roll instead of killing it.
concurrency:
  group: deploy-dev-cis
  cancel-in-progress: false
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
jobs:
  # AA-993 M4b (root ADR 0017 d7, design D2.7) — schema gate, before the job guard (so the guard's answer is fresh
  # when the roll starts) and in parallel with the build. Every CIS key this commit needs (LEGACY_CIS_BASELINE + 1 up to
  # REQUIRED_CIS_SCHEMA of api/core/readiness.py, plus every api/migrations/ file in that range) must be in
  # /health/ready `registered_keys` on Dev, and the AA-CIS-Infra Migration Apply run that applied files last must be
  # green (its apply and blocking Isolation Probe jobs). Polls up to SCHEMA_GATE_TIMEOUT_S (repo variable, default
  # 2400 s: an expand file merged in the same PR is copied by the migration-sync bot and applied by Migration Apply
  # meanwhile), then fails BEFORE the roll. No AWS, no secret: /health/ready and the Infra Actions API are public. With
  # DB_AUTO_APPLY off it only checks that the keys are registered, which the manual DB Migrate flow already guarantees
  # (apply within the window, or re-run this workflow after the apply). Logic: .github/scripts/schema_gate.py
  # (tests/unit/test_schema_gate_script.py).
  schema-gate:
    name: Schema gate
    runs-on: ubuntu-latest
    # The script stops at SCHEMA_GATE_TIMEOUT_S (default 2400 s, at most 2580 s); the job limit is the backstop.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            api/core/readiness.py
            api/migrations
          sparse-checkout-cone-mode: false
      - name: Wait until Dev has every key this commit needs
        env:
          GH_TOKEN: ${{ github.token }}
          SCHEMA_GATE_TIMEOUT_S: ${{ vars.SCHEMA_GATE_TIMEOUT_S }}
        run: |
          python3 .github/scripts/schema_gate.py --app cis --readiness-file api/core/readiness.py \
            --migrations-dir api/migrations --ready-url https://api-cis.lumiguides.it.com/health/ready

  # AA-725 part 1 — pre-deploy guard; meaning changed by AA-993 G5 (design D1.4). CI has no RDS
  # access (private subnet), so it asks the LIVE api. The guard blocks the roll only while a rerun
  # wave is open (shared.rerun_wave) or a job of a `deploy_blocking` kind is running (or queued, due
  # within 15 min: this guard runs before the build, and the old task would claim it); any other
  # running job is drained and released by the worker on SIGTERM and re-claimed by the new revision
  # (G1-G4), and queued jobs are claimed by whichever image is live. A workflow_dispatch run with an
  # `override_running_jobs` reason (Nghiệp only) passes anyway (logged below). The response still
  # reports queued/running counts (`active`, `by_status`) and why it blocks (`blocked_by`).
  preflight:
    name: Pre-deploy job guard
    needs: schema-gate
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Fails closed (AA-868): a missing secret or an unreachable gate blocks the roll; an
      # override reason lets it through (also the way out when the API itself is down).
      - name: Check for an open wave or a running deploy-blocking job
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          OVERRIDE: ${{ inputs.override_running_jobs }}
          GATE_URL: https://api-cis.lumiguides.it.com/admin/job-runner/deploy-gate
        run: bash .github/scripts/deploy_job_guard.sh

  build-and-push:
    name: Build and Push ECR
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      # AA-725 part 5 — export only the per-commit TAG (dev-<sha>), never the full image. The full
      # image embeds ECR_REGISTRY, which is a repo secret, and GitHub drops any job output that
      # contains a secret value ("Skip output 'image' since it may contain secret") — that left
      # DEPLOY_IMAGE empty downstream. The tag has no secret, so it survives; the deploy job
      # rebuilds the full image from its own ECR_REGISTRY/ECR_REPOSITORY env.
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2.2.0
      # S273: the verified spaCy model wheel into the build context's .url-wheels/ seed (no github.com download in the
      # image build). Runs on main, so its cache entry is readable by every PR and merge-queue run.
      - name: URL-pinned wheels (cached, hash-checked)
        uses: ./.github/actions/url-wheels
        with:
          copy-to: .url-wheels
      - name: Build, tag, push image
        id: build
        run: |
          # AA-725 part 5 — deploy by the IMMUTABLE per-commit tag, not `:latest`. `:latest` is a
          # moving tag: api and worker register their task definitions at different moments, and a
          # second push landing in between would leave them on two different SHAs even though both
          # task defs say `:latest`. The deploy job pins this exact tag for BOTH services so they
          # always share one SHA. AA-869: `:latest` is no longer pushed (the repo becomes IMMUTABLE,
          # where a moving tag cannot be re-pushed); the frozen `:latest` left in ECR is only the
          # placeholder image of the Terraform task definitions, which the services ignore.
          IMAGE_TAG=dev-${{ github.sha }}
          FULL_IMAGE=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          # An immutable tag cannot be pushed twice: a re-run or a dispatch of a commit that was already
          # built (S241 run 39036415606 failed on exactly that) reuses the image already in ECR.
          if aws ecr describe-images --repository-name "${{ env.ECR_REPOSITORY }}" \
               --image-ids imageTag="$IMAGE_TAG" --region "${{ env.AWS_REGION }}" >/dev/null 2>&1; then
            echo "Image $IMAGE_TAG already in ECR — reusing it, no build."
          else
            docker build --build-arg GIT_SHA=${{ github.sha }} -t $FULL_IMAGE .
            docker push $FULL_IMAGE
          fi
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
  deploy:
    name: Deploy to ECS Dev
    runs-on: ubuntu-latest
    environment: dev
    needs: [build-and-push, preflight, schema-gate]
    # AA-1193: the revisions api and worker ran before this deploy (rollback targets). Revision NUMBERS only: the
    # family names are the ECS_SERVICE secret, and GitHub drops a job output that contains a secret value (AA-725
    # part 5). Empty = unknown or unsafe: the rollback is then refused.
    outputs:
      api_rev: ${{ steps.before.outputs.api_rev }}
      worker_rev: ${{ steps.before.outputs.worker_rev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
      # AA-651 — the worker runs the SAME image as the api on its own ECS service. The real
      # services are `aa-cis-dev-api` (api) and `aa-cis-dev-worker` (worker). ECS_SERVICE is
      # `aa-cis-dev-api`, so the worker name is the api name with its `-api` suffix replaced by
      # `-worker` — NOT `${ECS_SERVICE}-worker` (that gave `aa-cis-dev-api-worker`, which never
      # matched, so every deploy silently skipped the worker and it stayed on an old image).
      - name: Derive worker service name
        run: echo "ECS_WORKER_SERVICE=${ECS_SERVICE%-api}-worker" >> "$GITHUB_ENV"
        env:
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      # AA-725 part 5 — build the immutable image from the per-commit TAG (from build-and-push, no
      # secret) plus this job's own ECR_REGISTRY/ECR_REPOSITORY env, and export it for every step
      # below via $GITHUB_ENV. We cannot pass the full image as a job output: it embeds the
      # ECR_REGISTRY secret, so GitHub drops the output and DEPLOY_IMAGE would be empty.
      - name: Resolve deploy image
        env:
          IMAGE_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          echo "DEPLOY_IMAGE=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG:?tag not set}" >> "$GITHUB_ENV"
      - name: Install jq
        run: sudo apt-get install -y jq
      # AA-651 — register a fresh task definition for one family with the new image, then point
      # its service at it. Reused for both api and worker. Both families are created by Terraform
      # (modules/ecs); this only ever bumps the image on the latest revision, preserving every
      # other field (command override, env, secrets, stopTimeout) that Terraform set.
      - name: Deploy helper
        run: |
          cat > /tmp/deploy_family.sh <<'SH'
          set -euo pipefail
          FAMILY="$1"; SERVICE="$2"
          # AA-725 part 5 — pin the exact per-commit image passed by the deploy steps (DEPLOY_IMAGE),
          # not `:latest`, so api and worker are guaranteed to roll the SAME SHA in one deploy.
          NEW_IMAGE="${DEPLOY_IMAGE:?DEPLOY_IMAGE not set}"
          # --desired-count 1 on purpose: it wakes a service scaled to 0 (cost stop) so the roll
          # has a task to replace; Dev runs one task per service (AA-868 kept this).
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$SERVICE" \
            --desired-count 1 --region "$AWS_REGION" >/dev/null
          aws ecs describe-task-definition --task-definition "$FAMILY" --region "$AWS_REGION" \
            --query 'taskDefinition' --output json | \
          jq --arg img "$NEW_IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.placementConstraints,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) | .containerDefinitions[0].image = $img' \
          > /tmp/td_${FAMILY}.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td_${FAMILY}.json \
            --region "$AWS_REGION" --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $FAMILY: ${NEW_ARN##*/}"  # family:revision only; the ARN carries the account id (public repo)
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_ARN" --region "$AWS_REGION" >/dev/null
          SH
          chmod +x /tmp/deploy_family.sh
      # AA-1193 (same mechanism as AA-1119 for the web deploys): record what api and worker run now, before any
      # update-service, so a red post-deploy verify can move both back (`rollback` below). The family must be the
      # service name (deploy_family.sh registers into FAMILY = SERVICE) and the image a real build, else empty.
      # Drill (input drill_force_smoke_fail): refused here, before the roll, when Dev already runs this commit (the
      # rollback would have nothing older to go back to).
      - name: Record the revisions before this deploy (rollback targets)
        id: before
        env:
          DRILL: ${{ inputs.drill_force_smoke_fail == true }}
        run: |
          set -euo pipefail
          record() {  # output name, service, container
            local out td tag rev=""
            out=$(python3 .github/scripts/ecs_smoke_rollback.py previous --cluster "$ECS_CLUSTER" --service "$2" --container "$3")
            td=$(sed -n 's/^previous_td=//p' <<<"$out"); tag=$(sed -n 's/^previous_tag=//p' <<<"$out")
            if [ -n "$td" ] && [ "${td%:*}" = "$2" ]; then rev="${td##*:}"; fi
            echo "$1=${rev}" >> "$GITHUB_OUTPUT"
            echo "$1: ${rev:-none} (image ${tag:-none})"
            if [ "$DRILL" = "true" ] && [ "$tag" = "dev-${GITHUB_SHA}" ]; then
              echo "::error::drill: $3 already runs this commit, so there is nothing older to roll back to. Merge a commit that does not deploy (docs only) and dispatch the drill again."
              exit 1
            fi
          }
          record api_rev "$ECS_SERVICE" api
          record worker_rev "$ECS_WORKER_SERVICE" worker
      # AA-1024 G3 (c), S272 review: the preflight ran in parallel with the image build, minutes before this roll.
      # Ask the gate again right before update-service: an ECS exec script (ecsx heartbeat) or a deploy-blocking job
      # started during the build would be killed by the roll (lesson S234). Same script, same override.
      - name: Re-check the deploy gate just before the roll
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          OVERRIDE: ${{ inputs.override_running_jobs }}
          GATE_URL: https://api-cis.lumiguides.it.com/admin/job-runner/deploy-gate
        run: bash .github/scripts/deploy_job_guard.sh
      - name: Deploy api
        run: /tmp/deploy_family.sh "${{ env.ECS_SERVICE }}" "${{ env.ECS_SERVICE }}"
      # AA-651 — the worker family/service is created by AA-CIS-Infra. Until that applies, skip
      # the worker roll gracefully instead of failing the whole deploy (breaks the chicken-and-egg
      # on first rollout: the image must exist before Infra can create the worker service, and the
      # service must exist before this step can roll it). Once it exists, this deploys it normally.
      - name: Deploy worker
        run: |
          if aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" \
               --services "${{ env.ECS_WORKER_SERVICE }}" --region "${{ env.AWS_REGION }}" \
               --query 'services[?status==`ACTIVE`].serviceName' --output text | grep -q .; then
            /tmp/deploy_family.sh "${{ env.ECS_WORKER_SERVICE }}" "${{ env.ECS_WORKER_SERVICE }}"
          else
            echo "Worker service ${{ env.ECS_WORKER_SERVICE }} not found yet (AA-CIS-Infra not applied) — skipping."
          fi
      - name: Wait stable
        run: |
          SERVICES="${{ env.ECS_SERVICE }}"
          if aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" \
               --services "${{ env.ECS_WORKER_SERVICE }}" --region "${{ env.AWS_REGION }}" \
               --query 'services[?status==`ACTIVE`].serviceName' --output text | grep -q .; then
            SERVICES="$SERVICES ${{ env.ECS_WORKER_SERVICE }}"
          fi
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services $SERVICES \
            --region ${{ env.AWS_REGION }}
          echo "ECS deployment stable ($SERVICES)"

  # AA-993 V1 (ADR 0016 D3) — the post-deploy checks (api/worker same image SHA, the live smoke rows, the worker
  # rows) moved to post-deploy-verify.yml, which is also dispatchable on its own. It runs only when `deploy`
  # succeeded; `result` below turns a skipped or failed verify red.
  verify:
    name: Post-deploy verify
    needs: deploy
    uses: ./.github/workflows/post-deploy-verify.yml
    with:
      expected_sha: ${{ github.sha }}
      from_deploy: true
      # AA-1193 drill: the verify runs every real check, then turns red on purpose (row drill-forced-fail).
      drill_force_fail: ${{ inputs.drill_force_smoke_fail == true }}
    secrets: inherit

  # AA-1193 (S295 Well-Architected review, OPS06): a red post-deploy verify must not leave the bad build serving. When
  # `verify` failed after a successful deploy, move api AND worker back to the revisions recorded before the deploy
  # (.github/scripts/ecs_api_rollback.py: all or none, so both keep one image; each service through the AA-1119 safety
  # rules of ecs_smoke_rollback.py), then /health must answer the previous commit. Same deploy gate as the deploy: an
  # open wave or a running deploy-blocking job holds the rollback (a roll would kill it), unless the dispatch gave an
  # override reason. Refused or held = nothing changed. Then one message on the alerts topic (the failing checks, the
  # outcome) and the deploy-smoke-red issue (`report`). Never a loop: an update-service to an existing revision builds
  # and pushes nothing and starts no workflow. The run stays red (`result`); fix forward on main.
  rollback:
    name: Roll back after a red post-deploy verify
    needs: [deploy, verify]
    if: >-
      always() && github.ref == 'refs/heads/main'
      && needs.deploy.result == 'success' && needs.verify.result == 'failure'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    outputs:
      outcome: ${{ steps.rollback.outputs.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
      - name: Roll back api and worker to the revisions before this deploy
        id: rollback
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          OVERRIDE: ${{ inputs.override_running_jobs }}
          GATE_URL: https://api-cis.lumiguides.it.com/admin/job-runner/deploy-gate
          API_REV: ${{ needs.deploy.outputs.api_rev }}
          WORKER_REV: ${{ needs.deploy.outputs.worker_rev }}
        run: |
          set -uo pipefail
          WORKER="${ECS_SERVICE%-api}-worker"
          if bash .github/scripts/deploy_job_guard.sh > /tmp/gate.log 2>&1; then gate=open; else gate=held; fi
          cat /tmp/gate.log
          if [ "$gate" = "held" ]; then
            reason=$(grep -m1 '^::error::' /tmp/gate.log | sed 's/^::error::Deploy blocked: //' | cut -c1-200)
            outcome="not rolled back (held by the deploy gate: ${reason:-blocked}); roll back by hand once idle (root runbook rollback-cis.md)"
            status=3
          else
            python3 .github/scripts/ecs_api_rollback.py rollback --cluster "$ECS_CLUSTER" --repository "$ECR_REPOSITORY" \
              --deployed-tag "dev-${GITHUB_SHA}" \
              --target "${ECS_SERVICE},api,${API_REV:+${ECS_SERVICE}:${API_REV}}" \
              --target "${WORKER},worker,${WORKER_REV:+${WORKER}:${WORKER_REV}}" \
              --health-url https://api-cis.lumiguides.it.com/health --apply > /tmp/rollback.out 2> /tmp/rollback.log
            status=$?
            cat /tmp/rollback.log
            outcome=$(sed -n 's/^outcome=//p' /tmp/rollback.out)
            outcome="${outcome:-rollback FAILED (exit $status)}"
          fi
          # Service names -> api / worker: the api family name is the ECS_SERVICE secret, and GitHub drops a job output
          # that contains a secret value.
          outcome="${outcome//${ECS_SERVICE}/api}"
          outcome="${outcome//${WORKER}/worker}"
          printf '%s' "$outcome" > /tmp/outcome.txt
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          echo "- $outcome" >> "$GITHUB_STEP_SUMMARY"
          # Refused or held is a safe outcome (nothing changed); a failed rollback is red.
          [ "$status" = 0 ] || [ "$status" = 3 ]
      # The alerts SNS topic (the ops topic of every alarm), read from the api task definition's ALERTS_TOPIC_ARN; the
      # deploy role needs sns:Publish on it (AA-CIS-Infra). Not sent = a warning: the issue below still opens.
      - name: Alert the ops topic
        if: always()
        env:
          FAILED_CHECKS: ${{ needs.verify.outputs.failed_checks }}
          DRILL: ${{ inputs.drill_force_smoke_fail == true }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          outcome=$(cat /tmp/outcome.txt 2>/dev/null || echo "the rollback step did not finish (read the run)")
          extra=()
          [ "$DRILL" = "true" ] && extra+=(--drill)
          python3 .github/scripts/ecs_api_rollback.py alert --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --container api --app "CIS api + worker" --commit "$GITHUB_SHA" --failed-checks "$FAILED_CHECKS" \
            --outcome "$outcome" --run-url "$RUN_URL" "${extra[@]}" --apply
          status=$?
          [ "$status" != 4 ] || echo "::warning::the ops alert was not sent (see the log above); the deploy-smoke-red issue still opens"
          [ "$status" = 0 ] || [ "$status" = 4 ]

  # AA-1193: one open issue labelled deploy-smoke-red per workflow while its post-deploy verify is red on main (opened,
  # then commented on), closed by the next verified deploy. Same job as the web deploy workflows (AA-1119). Only this
  # job writes, and only issues; no checkout.
  report:
    name: Report a red post-deploy verify (issue)
    needs: [deploy, verify, rollback]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "Deploy Dev: post-deploy verify is red"
      VERIFY: ${{ needs.verify.result }}
      FAILED_CHECKS: ${{ needs.verify.outputs.failed_checks }}
      OUTCOME: ${{ needs.rollback.outputs.outcome || needs.rollback.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, comment on or close the deploy-smoke-red issue
        run: |
          set -euo pipefail
          N=$(gh issue list --label deploy-smoke-red --state open --limit 50 --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')
          if [ "$VERIFY" = "success" ]; then
            if [ -n "$N" ]; then
              gh issue close "$N" --comment "Verified again on ${GITHUB_SHA::7}: $RUN_URL"
              echo "- post-deploy verify green: closed #$N" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          BODY="Deploy Dev on \`${GITHUB_SHA::7}\`: verify **$VERIFY** (failing checks: ${FAILED_CHECKS:-see the run}). Rollback: ${OUTCOME:-not run}.
          Run: $RUN_URL

          Read the failed job first. A rollback leaves main ahead of what runs: fix forward (revert or fix on main).
          Runbook: docs/ops/runbooks/rollback-cis.md in the root repo. The next verified deploy closes this issue."
          if [ -n "$N" ]; then
            gh issue comment "$N" --body "$BODY"
          else
            gh label create deploy-smoke-red --color B60205 --force \
              --description "A post-deploy verify or smoke is red on main (deploy workflows, AA-1119)"
            N=$(gh issue create --title "$TITLE" --label deploy-smoke-red --body "$BODY" | sed -nE 's#.*/issues/([0-9]+)$#\1#p')
          fi
          echo "::warning::post-deploy verify red: issue #$N (label deploy-smoke-red)"
          echo "- post-deploy verify red: issue #$N (label deploy-smoke-red)" >> "$GITHUB_STEP_SUMMARY"

  # AA-993 V1 — the run's verdict. GitHub shows a skipped job grey, not red, so without this a failed or skipped
  # preflight/build/deploy (verify then skips) could look like "nothing to verify". Every job here must succeed;
  # skipped, failed or cancelled is red on every event (no job it waits on is conditional; `rollback` and `report`
  # (AA-1193) are, and `result` does not wait on them: a rolled-back run stays red through `verify`).
  result:
    name: Deploy Dev result
    runs-on: ubuntu-latest
    if: always()
    needs: [schema-gate, preflight, build-and-push, deploy, verify]
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          BAD=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$BAD" ] || [ "$(echo "$NEEDS" | jq 'length')" -lt 5 ]; then
            echo "::error::Deploy Dev ($EVENT) is not verified: ${BAD:-a job result is missing}"
            exit 1
          fi
          echo "Deploy Dev ($EVENT): deployed and verified."

  # S240: the "Deploy Frontend to Vercel" job (deploy hook on every Deploy Dev run) was removed — it added a
  # second production deployment per merge and used up the Hobby cap (~100 deployments / 24 h, team-wide;
  # canceled deployments count too). S241: frontend deploys came only from vercel-deploy.yml. AA-911 (S272): Vercel
  # is retired; the admin app deploys to ECS from .github/workflows/deploy-admin-dev.yml.
