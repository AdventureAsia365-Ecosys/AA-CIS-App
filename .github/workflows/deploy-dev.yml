name: Deploy Dev
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'shared/**'
      - 'services/**'
      - 'worker/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      override_running_jobs:
        description: "AA-725 — reason to deploy anyway while jobs are queued/running (Nghiệp only). Leave empty to respect the guard."
        required: false
        type: string
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
  ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
  ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
jobs:
  # AA-725 part 1 — pre-deploy guard. A deploy restarts the api/worker containers; any job that is
  # queued or running would be interrupted (S212: 3 PRs merged mid Thailand wave killed 16 S1
  # jobs). CI has no RDS access (private subnet), so it asks the LIVE api, which counts shared.job
  # with no time filter. The guard blocks the roll when a job is active, unless a workflow_dispatch
  # run supplied `override_running_jobs` with a reason (logged below).
  preflight:
    name: Pre-deploy job guard
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Check for queued/running jobs
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          OVERRIDE: ${{ inputs.override_running_jobs }}
          GATE_URL: https://api-cis.lumiguides.it.com/admin/job-runner/deploy-gate
        run: |
          set -euo pipefail
          if [ -z "${ADMIN_SECRET:-}" ]; then
            echo "::warning::ADMIN_SECRET not configured — pre-deploy job guard is DISABLED. Set the ADMIN_SECRET repo secret to enable it (AA-725)."
            exit 0
          fi
          BODY=$(curl -s --max-time 20 -H "x-admin-secret: ${ADMIN_SECRET}" "${GATE_URL}")
          echo "deploy-gate: ${BODY}"
          SAFE=$(echo "${BODY}" | jq -r '.safe_to_deploy // empty')
          ACTIVE=$(echo "${BODY}" | jq -r '.active // "?"')
          if [ "${SAFE}" = "true" ]; then
            echo "No queued/running jobs — safe to deploy."
            exit 0
          fi
          if [ -n "${OVERRIDE:-}" ]; then
            echo "::warning::Deploy guard OVERRIDDEN with ${ACTIVE} active job(s). Reason: ${OVERRIDE}"
            exit 0
          fi
          echo "::error::Deploy blocked: ${ACTIVE} job(s) queued/running. Wait for them to finish, or re-run via workflow_dispatch with an 'override_running_jobs' reason."
          exit 1

  build-and-push:
    name: Build and Push ECR
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build, tag, push image
        id: build
        run: |
          IMAGE_TAG=dev-${{ github.sha }}
          FULL_IMAGE=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          LATEST=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          docker build \
            -t $FULL_IMAGE -t $LATEST .
          docker push $FULL_IMAGE
          docker push $LATEST
          echo "image=$LATEST" >> $GITHUB_OUTPUT
  deploy:
    name: Deploy to ECS Dev
    runs-on: ubuntu-latest
    environment: dev
    needs: [build-and-push, preflight]
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      # AA-651 — the worker runs the SAME image as the api on its own ECS service. The real
      # services are `aa-cis-dev-api` (api) and `aa-cis-dev-worker` (worker). ECS_SERVICE is
      # `aa-cis-dev-api`, so the worker name is the api name with its `-api` suffix replaced by
      # `-worker` — NOT `${ECS_SERVICE}-worker` (that gave `aa-cis-dev-api-worker`, which never
      # matched, so every deploy silently skipped the worker and it stayed on an old image).
      - name: Derive worker service name
        run: echo "ECS_WORKER_SERVICE=${ECS_SERVICE%-api}-worker" >> "$GITHUB_ENV"
        env:
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
      - name: Install jq
        run: sudo apt-get install -y jq
      # AA-651 — register a fresh task definition for one family with the new image, then point
      # its service at it. Reused for both api and worker. Both families are created by Terraform
      # (modules/ecs); this only ever bumps the image on the latest revision, preserving every
      # other field (command override, env, secrets, stopTimeout) that Terraform set.
      - name: Deploy helper
        run: |
          cat > /tmp/deploy_family.sh <<'SH'
          set -euo pipefail
          FAMILY="$1"; SERVICE="$2"
          NEW_IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:latest"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$SERVICE" \
            --desired-count 1 --region "$AWS_REGION" >/dev/null
          aws ecs describe-task-definition --task-definition "$FAMILY" --region "$AWS_REGION" \
            --query 'taskDefinition' --output json | \
          jq --arg img "$NEW_IMAGE" \
            'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.placementConstraints,.compatibilities,.registeredAt,.registeredBy,.deregisteredAt) | .containerDefinitions[0].image = $img' \
          > /tmp/td_${FAMILY}.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td_${FAMILY}.json \
            --region "$AWS_REGION" --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "Registered $FAMILY: $NEW_ARN"
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$SERVICE" \
            --task-definition "$NEW_ARN" --region "$AWS_REGION" >/dev/null
          SH
          chmod +x /tmp/deploy_family.sh
      - name: Deploy api
        run: /tmp/deploy_family.sh "${{ env.ECS_SERVICE }}" "${{ env.ECS_SERVICE }}"
      # AA-651 — the worker family/service is created by AA-CIS-Infra. Until that applies, skip
      # the worker roll gracefully instead of failing the whole deploy (breaks the chicken-and-egg
      # on first rollout: the image must exist before Infra can create the worker service, and the
      # service must exist before this step can roll it). Once it exists, this deploys it normally.
      - name: Deploy worker
        run: |
          if aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" \
               --services "${{ env.ECS_WORKER_SERVICE }}" --region "${{ env.AWS_REGION }}" \
               --query 'services[?status==`ACTIVE`].serviceName' --output text | grep -q .; then
            /tmp/deploy_family.sh "${{ env.ECS_WORKER_SERVICE }}" "${{ env.ECS_WORKER_SERVICE }}"
          else
            echo "Worker service ${{ env.ECS_WORKER_SERVICE }} not found yet (AA-CIS-Infra not applied) — skipping."
          fi
      - name: Wait stable
        run: |
          SERVICES="${{ env.ECS_SERVICE }}"
          if aws ecs describe-services --cluster "${{ env.ECS_CLUSTER }}" \
               --services "${{ env.ECS_WORKER_SERVICE }}" --region "${{ env.AWS_REGION }}" \
               --query 'services[?status==`ACTIVE`].serviceName' --output text | grep -q .; then
            SERVICES="$SERVICES ${{ env.ECS_WORKER_SERVICE }}"
          fi
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services $SERVICES \
            --region ${{ env.AWS_REGION }}
          echo "ECS deployment stable ($SERVICES)"
      # AA-725 part 2 — post-deploy live smoke. The old step curled only /health (a static 200
      # that stays green even when a router is broken — S212's SEO 500 shipped unnoticed). Now it
      # also hits a maintained list of read-only endpoints on the real domain and asserts 200 +
      # the expected JSON shape, so a broken endpoint turns this workflow red. Admin endpoints are
      # skipped when ADMIN_SECRET is not configured (health still runs).
      - name: Smoke test
        env:
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          BASE: https://api-cis.lumiguides.it.com
        run: |
          set -uo pipefail
          sleep 10
          fail=0

          # name|path|jq-shape-assertion (empty assertion = only check HTTP 200)
          public_checks=(
            "health|/health|.status == \"ok\""
          )
          admin_checks=(
            "job-runner summary|/admin/job-runner/summary|(.kinds | length) > 0"
            "deploy-gate|/admin/job-runner/deploy-gate|has(\"safe_to_deploy\")"
            "overview|/admin/overview|type == \"object\""
          )

          check() {
            local name="$1" path="$2" shape="$3"; shift 3
            local hdr=("$@")
            local body code
            body=$(curl -s --max-time 25 -o /tmp/body.json -w "%{http_code}" "${hdr[@]}" "${BASE}${path}")
            code="$body"
            if [ "$code" != "200" ]; then
              echo "::error::smoke [$name] ${path} -> HTTP $code"
              fail=1; return
            fi
            if [ -n "$shape" ]; then
              if ! jq -e "$shape" /tmp/body.json >/dev/null 2>&1; then
                echo "::error::smoke [$name] ${path} -> 200 but shape failed: $shape"
                fail=1; return
              fi
            fi
            echo "smoke [$name] ${path} -> 200 OK"
          }

          for row in "${public_checks[@]}"; do
            IFS='|' read -r name path shape <<< "$row"
            check "$name" "$path" "$shape"
          done

          if [ -n "${ADMIN_SECRET:-}" ]; then
            for row in "${admin_checks[@]}"; do
              IFS='|' read -r name path shape <<< "$row"
              check "$name" "$path" "$shape" -H "x-admin-secret: ${ADMIN_SECRET}"
            done
          else
            echo "::warning::ADMIN_SECRET not set — admin smoke checks skipped (AA-725)."
          fi

          [ "$fail" = "0" ] && echo "All smoke checks passed" || (echo "Smoke checks failed" && exit 1)

  deploy-lambdas:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    environment: dev
    needs: build-and-push
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Package and deploy Lambdas
        run: |
          bash scripts/package_lambdas.sh
          for fn in ingestion seo validation export content brand-brief-parser; do
            ZIP="dist/lambdas/${fn}.zip"
            if [ -f "$ZIP" ]; then
              echo "Deploying $fn..."
              aws lambda update-function-code                 --function-name aa-cis-dev-${fn}                 --zip-file fileb://${ZIP}                 --region ${{ env.AWS_REGION }}                 --output text --query 'FunctionArn'
            fi
          done
          echo "Lambda deploy complete"

  deploy-vercel:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: []
    if: always()
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
