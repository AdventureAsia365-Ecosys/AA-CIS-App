# S242: Dependabot security updates arrived as one PR per transitive package (five or more a day), each
# with a red "Vercel deploy" check because Dependabot PRs get no repository secrets. npm and pip version updates are
# off (open-pull-requests-limit: 0); security updates are grouped into one PR per ecosystem. AA-903: the
# Vercel deploy jobs (and the UI smoke behind them) are skipped on Dependabot runs, so those PRs are no
# longer red; they get no preview either. To see a preview, push the same change from a normal branch.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      frontend-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  # AA-979: no /portal entry. The tenant portal lives in AA-Partner (its Dependabot covers it there); the frozen copy
  # that stayed here was deleted at the P2b clean-up.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  # AA-1022 (S263): version updates for the GitHub Actions used in .github/workflows, weekly, grouped into one PR (the
  # same setup as AA-CIS-Infra). Dependabot keeps a SHA pin and its "# vX.Y.Z" comment in step when it bumps one. Like
  # the PRs above, these get no repository secrets and skip the Vercel deploy jobs (AA-903).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
