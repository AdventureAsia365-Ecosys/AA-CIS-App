openapi: 3.1.0
info:
  title: tenant.addons.v1 (AA-CIS-App → AA-Partner CRM; an agency's add-ons and its add-on requests)
  version: "1.2"
  description: >-
    CIS shared is the master of the tenant account and of the agency's add-on requests (shared.tenant_addon_request,
    CIS 374; root ADR 0019 d7, AA-1036 R3): an agency asks for an add-on (CRM, Trip planner), AA staff approve or
    decline it in CIS Tenant 360 › Subscription, and an approval attaches the plan through the CIS tenant_provision
    saga. The Content studio asks with the studio owner's own tenant token (CIS /v1/account/add-ons and
    /v1/account/add-on-requests). This contract is the same list and the same request for an agency whose owner works
    in the CRM without a Content studio membership: the CRM API relays its owner's request service to service, so the
    requests keep one store in CIS and one decision path. The CRM decides who may ask (the CRM owner of the agency,
    root ADR 0010 decision 5: CRM roles are the CRM's) and names that member by its CRM member id; CIS never learns
    a CRM role, a name or an e-mail. CIS applies the same rules as for the studio: refused while the account is not
    in service (409 tenant_not_in_service) or the add-on is already on (409 already_subscribed); one pending request per
    add-on (a second ask answers the open one with created false, no new staff notification); at most 10 requests per
    tenant in 24 hours (429 too_many_requests); an optional note of at most 500 characters. The note is the agency's
    own text and decision_note the reason AA staff wrote for the agency; no staff actor, plan key, job id, price or
    billing field crosses. tenant_id is the CIS tenant id, which is the CRM agency id. Auth: M2M token of the aa-m2m
    pool, client = AA-Partner (CRM), scope cis.tenant/addons (every operation).
    1.1 (AA-1139, the TripPlanner module of the agency app) adds the agency's Trip planner as the CRM's module page
    shows it and lets the agency owner change it: the planner addresses (hosted URL, active custom domains, launcher),
    every custom domain with its state, the lead route (the stored channel and target, and the channel leads take now:
    crm while the CRM add-on is live, as catalog.v_tenant_tripplanner_v1 resolves it), the theme (the kit's brand
    tokens, each #rrggbb), the locale and the AI sessions quota a month (tp.ai_sessions, null = no limit). The CRM
    checks who may read (owner, agent) and write (owner) and names the member; CIS applies the checks of its Tenant
    360 editor (an https webhook URL whose host can be public, an e-mail address whose domain is not internal, the
    brand tokens only) and audits the write as the CRM member. A write needs an active Trip planner (409
    tripplanner_not_active). Usage, leads and the webhook signing key are TripPlanner's (lead.submitted.v1 1.1).
    1.2 (AA-1160, no shape change): effective_channel is crm only while the CRM add-on is live AND the CRM holds an
    agency for the tenant (catalog.v_tenant_tripplanner_v1 crm_agency, tenant.entitlements.v1 1.11); with the add-on
    but no CRM agency yet the planner's leads take the stored route (webhook, email or none), and effective_channel
    says so. crm_core keeps its meaning (the add-on is live).
  x-aa-contract: tenant.addons.v1
  x-aa-producer: AA-CIS-App
  x-aa-consumers: [AA-Partner]
  x-aa-issues: [AA-1036, AA-1139, AA-1160]
servers:
  - url: /tenant/v1
security:
  - m2m: [cis.tenant/addons]
paths:
  /tenants/{tenant_id}/add-ons:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listTenantAddOns
      summary: The agency's add-ons (active, requested or available) with the pending request and the last decision
      responses:
        "200":
          description: One entry per add-on product
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AddOnList"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /tenants/{tenant_id}/add-on-requests:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: requestTenantAddOn
      summary: Ask Adventure Asia for an add-on on behalf of the agency's CRM owner
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AddOnRequestIn"}
      responses:
        "201":
          description: The new request (staff are notified)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AddOnRequestCreated"}
        "200":
          description: A request for this add-on is already open (created false; nothing new written)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AddOnRequestCreated"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /tenants/{tenant_id}/tripplanner:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getTenantTripPlanner
      summary: The agency's Trip planner as its module page shows it (1.1)
      responses:
        "200":
          description: The module
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TripPlannerModule"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /tenants/{tenant_id}/tripplanner/lead-route:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: putTenantTripPlannerLeadRoute
      summary: Set where the planner's leads go while the agency has no CRM add-on (the agency owner; 1.1)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TripPlannerLeadRouteIn"}
      responses:
        "200":
          description: The module after the change
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TripPlannerModule"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
  /tenants/{tenant_id}/tripplanner/appearance:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: putTenantTripPlannerAppearance
      summary: Set the planner's theme and language (the agency owner; 1.1)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TripPlannerAppearanceIn"}
      responses:
        "200":
          description: The module after the change
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TripPlannerModule"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    m2m:
      type: oauth2
      description: Cognito M2M pool aa-m2m-<env>, client credentials.
      flows:
        clientCredentials:
          tokenUrl: https://m2m-auth.example.invalid/oauth2/token
          scopes:
            cis.tenant/addons: Read an agency's add-ons and request one on behalf of its CRM owner; read and change
              its Trip planner (1.1)
  responses:
    Problem:
      description: Error
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    Problem:
      type: object
      additionalProperties: false
      required: [error, message]
      properties:
        error:
          type: string
          enum: [unauthorized, forbidden, not_found, invalid, conflict, too_many_requests, unavailable]
        reason:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,39}$"
          description: >-
            CIS's stable refusal code where the status has more than one cause (as tenant.membership.v1): 409
            already_subscribed or tenant_not_in_service, 429 too_many_requests, 400 unknown_product or note_too_long,
            404 tenant_not_found. 1.1: 409 tripplanner_not_active or tenant_offboarded; 422 (error invalid) the
            editor's code, which names the field: lead_channel_invalid, lead_webhook_url_required / _too_long /
            _not_https / _invalid / _not_public, lead_email_required / _invalid / _not_public, theme_invalid,
            theme_token_unknown, theme_colour_invalid, locale_invalid. A consumer shows an unknown reason as a generic
            refusal.
        message: {type: string, maxLength: 500}
    Product:
      type: string
      enum: [crm, tripplanner]
    Text:
      type: [string, "null"]
      maxLength: 500
    AddOnRequest:
      type: object
      additionalProperties: false
      required: [request_id, product, status, note, requested_at, decided_at, decision_note, setup]
      properties:
        request_id: {type: string, format: uuid}
        product: {$ref: "#/components/schemas/Product"}
        status:
          type: string
          enum: [pending, approved, declined]
        note:
          $ref: "#/components/schemas/Text"
          description: The agency's own note on its request.
        requested_at: {type: string, format: date-time}
        decided_at: {type: [string, "null"], format: date-time}
        decision_note:
          $ref: "#/components/schemas/Text"
          description: What AA staff wrote for the agency (a decline's reason); never the staff member.
        setup:
          type: [string, "null"]
          enum: [in_progress, done, failed, null]
          description: >-
            An approved request's setup (the attach job): in_progress, done, or failed (the add-on is not on yet;
            Adventure Asia finishes it). Null when not approved or no longer known.
    AddOnState:
      type: object
      additionalProperties: false
      required: [product, state, subscription_status, request, last_decision]
      properties:
        product: {$ref: "#/components/schemas/Product"}
        state:
          type: string
          enum: [active, requested, available]
          description: active = a live subscription of the product (trialing, active or past_due); requested = a
            request is pending; available = neither.
        subscription_status:
          type: [string, "null"]
          enum: [trialing, active, past_due, null]
        request:
          oneOf:
            - {$ref: "#/components/schemas/AddOnRequest"}
            - {type: "null"}
          description: The pending request, if any.
        last_decision:
          oneOf:
            - {$ref: "#/components/schemas/AddOnRequest"}
            - {type: "null"}
          description: The newest decided request (approved or declined), if any.
    AddOnList:
      type: object
      additionalProperties: false
      required: [in_service, add_ons]
      properties:
        in_service:
          type: boolean
          description: The account may request add-ons now (account_status trial, active or past_due, not suspended,
            not offboarded).
        add_ons:
          type: array
          minItems: 2
          maxItems: 2
          items: {$ref: "#/components/schemas/AddOnState"}
    AddOnRequestIn:
      type: object
      additionalProperties: false
      required: [product, crm_member_id]
      properties:
        product: {$ref: "#/components/schemas/Product"}
        note: {$ref: "#/components/schemas/Text"}
        crm_member_id:
          type: string
          format: uuid
          description: >-
            The CRM member (crm.member, the agency's CRM owner the CRM checked) who asked; CIS records it as the
            request's requester and in its audit, never a name or an e-mail.
    AddOnRequestCreated:
      type: object
      additionalProperties: false
      required: [created, request]
      properties:
        created: {type: boolean}
        request: {$ref: "#/components/schemas/AddOnRequest"}
    BrandToken:
      type: string
      enum: [accent, accent-deep, accent-soft, accent-tint, accent-border, on-accent]
      description: A kit token the planner's brand layer themes (AA-CIS-App frontend/app/_kit/core/brandTheme.ts).
    Theme:
      type: object
      maxProperties: 6
      propertyNames: {$ref: "#/components/schemas/BrandToken"}
      additionalProperties:
        type: string
        pattern: "^#[0-9a-f]{6}$"
      description: Brand token -> colour (stored lower case). Empty = the kit's own colours.
    PlannerAddresses:
      type: object
      additionalProperties: false
      required: [url, domains, launcher]
      properties:
        url: {type: string, format: uri, description: "The hosted planner, <TripPlanner origin>/<slug>/plan"}
        domains:
          type: array
          items: {type: string}
          description: The agency's active custom planner hosts, sorted.
        launcher: {type: boolean, description: The plan includes the launcher snippet (tp.launcher).}
    PlannerDomain:
      type: object
      additionalProperties: false
      required: [domain, status]
      properties:
        domain: {type: string}
        status:
          type: string
          enum: [pending, validating, attaching, active, failed]
          description: The custom host's state (a host being removed is not listed).
    PlannerLeadRoute:
      type: object
      additionalProperties: false
      required: [lead_channel, lead_webhook_url, lead_email, effective_channel, updated_at]
      properties:
        lead_channel:
          type: string
          enum: [none, webhook, email]
          description: The stored route, used while the agency has no CRM add-on.
        lead_webhook_url: {type: [string, "null"], maxLength: 500}
        lead_email: {type: [string, "null"], maxLength: 254}
        effective_channel:
          type: string
          enum: [crm, webhook, email, none]
          description: Where a lead goes now (crm while the CRM add-on is live and the CRM holds the agency, 1.2;
            else the stored route; none = the planner refuses leads).
        updated_at: {type: [string, "null"], format: date-time}
    TripPlannerModule:
      type: object
      additionalProperties: false
      required: [active, in_service, planner, domains, crm_core, lead_route, theme, locale, ai_sessions_monthly]
      properties:
        active: {type: boolean, description: The agency has a Trip planner subscription that is not canceled.}
        in_service: {type: boolean}
        planner:
          oneOf:
            - {$ref: "#/components/schemas/PlannerAddresses"}
            - {type: "null"}
          description: Null unless active, in service and hosted (tp.hosted).
        domains:
          type: array
          items: {$ref: "#/components/schemas/PlannerDomain"}
        crm_core: {type: boolean, description: The CRM add-on is live (leads go to the CRM).}
        lead_route: {$ref: "#/components/schemas/PlannerLeadRoute"}
        theme: {$ref: "#/components/schemas/Theme"}
        locale:
          type: string
          enum: [en, vi]
        ai_sessions_monthly:
          type: [integer, "null"]
          minimum: 0
          description: The plan's AI sessions a month (tp.ai_sessions); null = no limit. TripPlanner counts the use.
    TripPlannerLeadRouteIn:
      type: object
      additionalProperties: false
      required: [lead_channel, crm_member_id]
      properties:
        lead_channel:
          type: string
          enum: [none, webhook, email]
        lead_webhook_url: {type: [string, "null"], maxLength: 600}
        lead_email: {type: [string, "null"], maxLength: 354}
        crm_member_id:
          type: string
          format: uuid
          description: The CRM owner the CRM checked; the audit actor crm-member:<id>.
    TripPlannerAppearanceIn:
      type: object
      additionalProperties: false
      required: [theme, locale, crm_member_id]
      properties:
        theme: {$ref: "#/components/schemas/Theme"}
        locale:
          type: string
          enum: [en, vi]
        crm_member_id:
          type: string
          format: uuid
