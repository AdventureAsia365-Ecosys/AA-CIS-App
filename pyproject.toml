[tool.pytest.ini_options]
asyncio_mode = "strict"
# AA-1024 G6: the repo root is on sys.path for every run (a single file, a shard, a subdirectory), so `api.`,
# `services.`, `shared.` and `scripts.` imports never depend on which conftest happened to load first.
pythonpath = ["."]
markers = ["real_atom_seed: run with the real AA-768 atom seed helper (no conftest stub)",
           "real_breaker: run with the AA-1002 S4 LLM circuit breaker on (in process; conftest stubs its DB)",
           "real_served_state: run with the real AA-986 served-state reads (no conftest stand-in)",
           "real_provider_circuit: run with the AA-1025 B3 provider circuit on (in process; conftest stubs its DB)",
           "real_subject_gate: run with the real AA-1039 AA-subject gate hooks (no conftest stub)",
           "real_cassette: run with the AA-900 cassette recorder on (the test replaces its DB write)",
           "real_factsheet_store: run with the AA-1047 FactSheet store on (the test gives it a fake connection)"]

[tool.coverage.run]
omit = [
    "services/acp_s4/generate.py",
    "services/acp_s4_evaluate/handler.py",
]
